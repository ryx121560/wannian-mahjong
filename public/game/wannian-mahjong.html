<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>万年麻将</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a3c1a;overflow:hidden}
canvas{display:block;margin:112px auto 0;border:12px solid #8b4513;border-radius:16px}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:200px}
#bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);box-sizing:border-box;width:min(520px,calc(100vw - 24px));max-width:calc(100vw - 24px);overflow:hidden;white-space:pre-line;min-height:60px;background:rgba(0,0,0,0.78);color:#ffcc00;padding:8px 18px;border:1px solid rgba(212,160,23,0.45);border-radius:8px;font-size:14px;line-height:1.45;text-align:center;z-index:90;pointer-events:none;font-variant-numeric:tabular-nums}
#btns{display:flex;gap:10px;pointer-events:auto}
button{padding:10px 20px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;color:#fff}
.btn-d{background:#4a752c}.btn-d:hover{background:#5a9a3c}.btn-d:disabled{background:#555;color:#aaa}
.btn-a{background:#d4a017}.btn-a:hover{background:#e8b830}.btn-a:disabled{background:#555;color:#aaa}
.btn-w{background:#c0392b}.btn-w:hover{background:#e74c3c}.btn-w:disabled{background:#555;color:#aaa}
.btn-p{background:#888}.btn-p:hover{background:#aaa}.btn-p:disabled{background:#666;color:#bbb}
.btn-n{background:#2980b9}.btn-n:hover{background:#3498db}

.btn-eye{background:#555;color:#fff}.btn-eye.on{background:#e67e22}
#suggest{position:fixed;top:112px;width:480px;max-height:calc(100vh - 152px);overflow-y:auto;background:rgba(0,0,0,0.85);color:#ccc;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.7;pointer-events:auto;display:none;border:1px solid #4a752c}
#suggest h3{margin:0 0 8px;color:#e8b830;font-size:15px;text-align:center}
#suggest .rec{background:rgba(232,184,48,0.15);padding:6px 10px;border-radius:6px;margin-bottom:8px;text-align:center;font-size:17px;color:gold}
#suggest .rec span{font-weight:bold;color:#fff}
#suggest table{width:100%;border-collapse:collapse;margin:6px 0}
#suggest td,#suggest th{border:1px solid #444;padding:3px 6px;text-align:center;font-size:12px}
#suggest th{background:rgba(74,117,44,0.3);color:#9f9}
#suggest .path-on{color:gold;font-weight:bold}
#suggest .reason{color:#aaa;font-size:12px;margin-top:6px}
#suggest .reason b{color:#ddd}
#suggest .suggest-action{padding:6px 10px;border-radius:6px;margin-bottom:6px;text-align:center;font-size:15px;font-weight:bold}
#suggest .suggest-pong{background:rgba(212,160,23,0.2);color:#e8b830;border:1px solid #d4a017}
#suggest .suggest-kong{background:rgba(46,125,50,0.2);color:#66bb6a;border:1px solid #2e7d32}
#suggest .action-label{display:inline-block;background:rgba(255,255,255,0.15);padding:2px 8px;border-radius:4px;margin-right:4px}
#suggest .rec-section{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px;margin:8px 0}
#suggest .rec-section h4{color:#e8b830;font-size:14px;margin:0 0 6px}
#suggest .rec-line{margin:4px 0;color:#ddd}
#suggest .rec-line b{color:#aaa}
#suggest .rec-tile{display:inline-block;color:#fff;background:rgba(232,184,48,0.18);border:1px solid rgba(232,184,48,0.45);border-radius:4px;padding:1px 6px;font-weight:bold}
#suggest .rec-candidate{border-top:1px solid rgba(255,255,255,0.08);padding:6px 0}
#suggest .rec-candidate:first-child{border-top:none}
#suggest .rec-candidate ul{padding-left:18px;margin:4px 0;color:#aaa}
#suggest .rec-conclusion{color:#ffdf70;margin-top:6px}
#rules-panel,#ai-log-panel,#ai-settings-panel{position:fixed;top:90px;left:50%;transform:translateX(-50%);width:520px;max-width:calc(100vw - 32px);background:rgba(0,0,0,0.9);color:#ddd;border:1px solid #d4a017;border-radius:10px;padding:16px 18px;z-index:300;display:none;line-height:1.7;font-size:13px;pointer-events:auto}
#rules-panel h3{color:#e8b830;text-align:center;margin-bottom:8px}
#rules-panel ul{padding-left:18px;margin:8px 0}
#rules-panel .close{display:block;margin:12px auto 0;background:#555;padding:8px 18px}
#ai-settings-panel h3{color:#e8b830;text-align:center;margin-bottom:8px}
#ai-settings-panel .option{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #333}
#ai-settings-panel input{margin-top:4px}
#ai-settings-panel .dimension{display:grid;grid-template-columns:82px 1fr 48px 32px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #2a2a2a}
#ai-settings-panel .dimension input[type=range]{width:100%}
#ai-settings-panel .dimension .value{color:#e8b830;text-align:right;font-variant-numeric:tabular-nums}
#ai-settings-panel .hint{color:#aaa;font-size:12px}
#ai-settings-panel .mode{color:gold;margin:8px 0;text-align:center}
#ai-settings-panel .close{display:block;margin:12px auto 0;background:#555;padding:8px 18px}
#ai-log-panel{width:680px;max-height:calc(100vh - 140px);overflow-y:auto}
#ai-log-panel h3{color:#e8b830;text-align:center;margin-bottom:8px}
#ai-log-panel .empty{color:#888;text-align:center;padding:14px}
#ai-log-panel .log-card{border:1px solid #444;border-radius:8px;margin:10px 0;padding:10px;background:rgba(255,255,255,0.04)}
#ai-log-panel .log-title{color:gold;font-weight:bold;margin-bottom:4px}
#ai-log-panel .meta{color:#aaa;font-size:12px;margin-bottom:6px}
#ai-log-panel .reason{color:#ddd;margin-bottom:8px}
#ai-log-panel table{width:100%;border-collapse:collapse;margin-top:6px}
#ai-log-panel th,#ai-log-panel td{border:1px solid #444;padding:3px 5px;text-align:center;font-size:12px}
#ai-log-panel th{background:rgba(74,117,44,0.3);color:#9f9}
#ai-log-panel .close{display:block;margin:12px auto 0;background:#555;padding:8px 18px}
@media (max-width:600px){#bar{top:8px;box-sizing:border-box;width:calc(100vw - 16px);max-width:calc(100vw - 16px);min-height:48px;padding:6px 10px;font-size:12px;line-height:1.35}}
   </style>
<style>#sp-status{display:none;position:fixed;bottom:60px;left:10px;background:rgba(0,0,0,0.85);color:#0f0;padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;line-height:1.6}</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="bar" aria-live="polite">当前积分加载中</div>
<div id="btns">
<button class="btn-a" id="bt-pong">碰</button>
<button class="btn-a" id="bt-kong">杠</button>
<button class="btn-w" id="bt-win">胡</button>
<button class="btn-p" id="bt-pass">过</button>
<button class="btn-n" id="bt-rules">规则</button>
<button class="btn-n" id="bt-ai-settings">AI设置</button>
<button class="btn-n" id="bt-new">新游戏</button>

<button class="btn-eye" id="bt-eye" title="显示/隐藏AI手牌">👁</button>
<button class="btn-n" id="bt-export" title="导出游戏记录到JSON文件">导出记录</button><button class="btn-n" id="bt-selfplay" title="AI自弈训练">自弈</button><button class="btn-n" id="bt-speed" title="切换自弈速度" style="display:none">快速</button>
</div>
</div>
<div id="rules-panel">
<h3>当前规则</h3>
<ul>
<li>四人麻将，1 名真人玩家和 3 名 AI，使用 136 张牌。</li>
<li>当前版本不吃牌，保留碰、明杠、暗杠、加杠、胡和自摸。</li>
<li>支持普通面子手、七对子、打烂、半正宗、全正宗路线。</li>
<li>东南西北和中发白包含万年麻将字牌特殊组合判定。</li>
<li>普通对局默认启用阶段六数据驱动策略复核，且不会覆盖规则合法性和明确 MCTS 结论。</li>
</ul>
<button class="close" id="bt-rules-close">关闭</button>
</div>
<div id="ai-settings-panel">
<h3>AI 设置</h3>
<div class="mode" id="ai-mode-label"></div>
<div class="hint" id="ai-core-label"></div>
<label class="option"><input type="checkbox" id="ai-use-rl"><span><b>普通对局启用 RL</b><br><span class="hint">默认关闭；开启后 RL 只有在不劣于规则结果时才会覆盖。</span></span></label>
<button class="close" id="bt-ai-settings-close">关闭</button>
</div>
<div id="ai-log-panel">
<h3>AI 出牌复盘</h3>
<div id="ai-log-body"></div>
<button class="close" id="bt-ai-log-export">导出AI日志</button>
<button class="close" id="bt-ai-log-close">关闭</button>
</div>
<div id="sp-status"><b>⚡ 自弈训练中</b><br>已完成: <span id="sp-count">0</span> 局<br><span id="sp-info" style="color:#aaa"></span><br><canvas id="sp-chart" width="220" height="50" style="background:#0a1a0a;border:2px solid #1a4a1a;border-radius:6px;margin-top:4px"></canvas></div>
<div id="suggest"><h3>AI 出牌建议</h3><div id="suggest-body"></div></div>

<script src="session_snapshot.js"></script>
<script src="ai/rule_core.js"></script>
<script src="rule_engine.js"></script>
<script src="strong_rule_ai.js"></script>
<script src="recommendation_engine.js"></script>
<script src="mcts_enhancement_engine.js"></script>
<script>
const W=1360,H=900,TW=52,TH=72,GAP=2;
const GAME_SESSION=window.GameSessionSnapshot;
const AI_RULE_CORE=window.AIRuleCore;
const RULE_ENGINE=window.WannianRuleEngine;
const STRONG_RULE_AI=window.WannianStrongRuleAI;
const RECOMMENDATION_ENGINE=window.WannianRecommendationEngine;
const MCTS_ENHANCEMENT=window.WannianMctsEnhancement;
if(!GAME_SESSION)throw new Error('Game session snapshot core failed to load');
if(!AI_RULE_CORE)throw new Error('AI rule core failed to load');
if(!RULE_ENGINE)throw new Error('Wannian rule engine failed to load');
if(!STRONG_RULE_AI)throw new Error('Wannian strong rule AI failed to load');
if(!RECOMMENDATION_ENGINE)throw new Error('Wannian recommendation engine failed to load');
if(!MCTS_ENHANCEMENT)throw new Error('Wannian MCTS enhancement engine failed to load');
const AI_ENGINE_INFO={id:'strong-rule-ai',version:'2026-06-27-stage2',source:'strong-rule',mode:'ordinary',ruleCoreId:AI_RULE_CORE.id,ruleCoreVersion:AI_RULE_CORE.version};
const STAGE6_MODEL_INFO={modelVersion:'stage6-lightweight-strategy-v1',trainingDataVersion:'stage6-mcts-selfplay-50000-v1',modelDecisionSchemaVersion:'stage6-model-decision-v1',ruleEngineVersion:'wannian-rule-engine-stage1-gated',mctsVersion:'stage5-mcts-enhancement-v1',strongRuleVersion:'strong-rule-ai-stage3-v1'};
const STRONG_AI_DIMENSIONS=[
  ['speed','速度'],['handValue','打点'],['waitQuality','听牌'],['kongZhichan','杠铲'],
  ['dalanRoute','打烂'],['defense','防守'],['position','位置'],['structure','结构']
];
const AI_RUNTIME_CONFIG={ordinaryMCTS:true,ordinaryRL:false,strongRule:true,strongWeights:{speed:1,handValue:0.8,waitQuality:0.8,kongZhichan:0.6,dalanRoute:0.7,defense:0.4,position:0.5,structure:1},strongEnabled:{speed:true,handValue:true,kongZhichan:true,waitQuality:true,dalanRoute:true,defense:true,position:true,structure:true}};
const AI_STRATEGY={
  defenseWeights:{low:1,medium:3,high:6,midFloor:1,lateFloor:4},
  danger:{oneMeld:1,twoMelds:2,late:1,scoreLead:1,repeatedSafe:1},
  threat:{twoMelds:2,oneMeldLate:1.5,longDiscardRiver:1,recentSafeTiles:1,lateBonus:1},
  risk:{leadMargin:20,behindMargin:20,nearReadyShanten:1,behindAttackFactor:0.45},
  safety:{opponentGenbutsu:5,multiOpponentDanger:2,suji:2,blockedSuji:3,wall:10,terminal:2,honor:3,opponentSuitDanger:3,opponentMeldSuitDanger:3}
};
console.info('[AI] engine='+AI_ENGINE_INFO.id+' version='+AI_ENGINE_INFO.version+' core='+AI_RULE_CORE.id+'@'+AI_RULE_CORE.version+' defaultSource='+AI_ENGINE_INFO.source);

function configureAiLearning(enabled){
  AI_ENGINE_INFO.mode=enabled?'selfplay':'ordinary';
  if(window.MCTS)window.MCTS.useMCTS=enabled?true:AI_RUNTIME_CONFIG.ordinaryMCTS;
  if(window.RL)window.RL.useRL=enabled?true:AI_RUNTIME_CONFIG.ordinaryRL;
  const sources=['strong-rule'];
  if(window.MCTS&&window.MCTS.useMCTS)sources.push('mcts');
  if(window.RL&&window.RL.useRL)sources.push('rl');
  AI_ENGINE_INFO.source=sources.join('+');
  console.info('[AI] mode='+AI_ENGINE_INFO.mode+' mcts='+(window.MCTS?window.MCTS.useMCTS:'n/a')+' rl='+(window.RL?window.RL.useRL:'n/a'));
}

function setOrdinaryAiConfig(useMCTS,useRL){
  AI_RUNTIME_CONFIG.ordinaryMCTS=true;
  AI_RUNTIME_CONFIG.ordinaryRL=!!useRL;
  if(!_selfPlay.running)configureAiLearning(false);
  renderAiSettingsPanel();
}

function strongAiConfig(){
  const enabled=STRONG_AI_DIMENSIONS.filter(function(item){return AI_RUNTIME_CONFIG.strongEnabled[item[0]];}).map(function(item){return item[0];});
  return {weights:Object.assign({},AI_RUNTIME_CONFIG.strongWeights),enabledDimensions:new Set(enabled)};
}

function setStrongAiWeight(key,value){
  AI_RUNTIME_CONFIG.strongWeights[key]=Math.round(Number(value)*10)/10;
  renderAiSettingsPanel();
}

function setStrongAiEnabled(key,value){
  AI_RUNTIME_CONFIG.strongEnabled[key]=!!value;
  renderAiSettingsPanel();
}

function renderAiSettingsPanel(){
  const r=document.getElementById('ai-use-rl'),label=document.getElementById('ai-mode-label'),coreLabel=document.getElementById('ai-core-label');
  if(r)r.checked=!!AI_RUNTIME_CONFIG.ordinaryRL;
  if(label)label.textContent='当前普通对局来源：'+AI_ENGINE_INFO.source;
  if(coreLabel)coreLabel.textContent='规则核心：'+AI_RULE_CORE.id+' @ '+AI_RULE_CORE.version+'；阶段六策略复核默认启用。';
}

function scorePosition(playerIdx){
  const me=GS.players[playerIdx];
  if(!me)return 'neutral';
  let leading=true,behind=true;
  for(let i=0;i<GS.players.length;i++){
    if(i===playerIdx||!GS.players[i])continue;
    if(me.score<GS.players[i].score+AI_STRATEGY.risk.leadMargin)leading=false;
    if(me.score>GS.players[i].score-AI_STRATEGY.risk.behindMargin)behind=false;
  }
  if(leading)return 'leading';
  if(behind)return 'behind';
  return 'neutral';
}

function aiDefenseProfile(playerIdx,danger,phase,shanten){
  let safeW=danger>=3?AI_STRATEGY.defenseWeights.high:danger>=2?AI_STRATEGY.defenseWeights.medium:danger>=1?AI_STRATEGY.defenseWeights.low:0;
  if(phase==='late')safeW=Math.max(safeW,AI_STRATEGY.defenseWeights.lateFloor);
  else if(phase==='mid')safeW=Math.max(safeW,AI_STRATEGY.defenseWeights.midFloor);
  const pos=scorePosition(playerIdx);
  let mode=danger>=2&&shanten>=3?'fullFold':danger>=2||phase==='late'?'semiFold':'none';
  let attackTolerance=false;
  if(pos==='behind'&&shanten<=AI_STRATEGY.risk.nearReadyShanten){
    safeW=Number((safeW*AI_STRATEGY.risk.behindAttackFactor).toFixed(2));
    mode='none';
    attackTolerance=true;
  }else if(pos==='leading'&&danger>=1){
    safeW=Math.max(safeW,AI_STRATEGY.defenseWeights.medium);
    mode=mode==='none'?'semiFold':mode;
  }
  return {weight:safeW,mode:mode,scorePosition:pos,attackTolerance:attackTolerance};
}

function aiDefenseWeight(danger,phase,playerIdx,shanten){
  return aiDefenseProfile(playerIdx,danger,phase,shanten).weight;
}

function aiCanUseIsolatedTieBreak(playerIdx,danger,phase,shanten,defenseDiff){
  const profile=aiDefenseProfile(playerIdx,danger,phase,shanten);
  return profile.mode==='none'&&profile.scorePosition!=='leading'&&(defenseDiff==null||defenseDiff<0.05);
}

function opponentThreatLevel(oppIdx){
  if(!GS.players[oppIdx])return 0;
  const phase=aiPhase();
  const melds=GS.players[oppIdx].melds||[];
  const discards=GS.playerDiscards[oppIdx]||[];
  let threat=0;
  if(melds.length>=2)threat+=AI_STRATEGY.threat.twoMelds;
  else if(melds.length>=1&&phase!=='early')threat+=AI_STRATEGY.threat.oneMeldLate;
  if(discards.length>=10)threat+=AI_STRATEGY.threat.longDiscardRiver;
  const recent=discards.slice(-3);
  if(recent.length>=3&&recent.every(function(t){return t.t==='honor'||t.v===1||t.v===9;}))threat+=AI_STRATEGY.threat.recentSafeTiles;
  if(phase==='late')threat+=AI_STRATEGY.threat.lateBonus;
  threat+=estimateOpponentTenpai(oppIdx)*0.25;
  return Number(threat.toFixed(2));
}

function maxOpponentThreat(playerIdx){
  let maxThreat=0;
  for(let i=0;i<4;i++){
    if(i===playerIdx)continue;
    maxThreat=Math.max(maxThreat,opponentThreatLevel(i));
  }
  return maxThreat;
}

// build tile set
const TILES=[];
const suits=['wan','tong','tiao'];
for(let s of suits)for(let v=1;v<=9;v++)for(let i=0;i<4;i++)TILES.push({k:`${s}${v}`,t:'num',s,v});
const honors=['dong','nan','xi','bei','zhong','fa','bai'];
for(let h of honors)for(let i=0;i<4;i++)TILES.push({k:h,t:'honor',s:h,v:0});

function lbl(t){
  if(t.t==='num'){const m={wan:'万',tong:'筒',tiao:'条'};return t.v+m[t.s];}
  const m={dong:'东',nan:'南',xi:'西',bei:'北',zhong:'中',fa:'发',bai:'白'};return m[t.s];
}
function tkey(t){return t.k;}
function teq(a,b){return a.k===b.k;}
const ALL_KEYS=(()=>{const a=[];for(let s of suits)for(let v=1;v<=9;v++)a.push(`${s}${v}`);for(let h of honors)a.push(h);return a;})();
const HONOR_KEYS=new Set(['dong','nan','xi','bei','zhong','fa','bai']);
const SUIT_KEYS=new Set(['wan','tong','tiao']);
function kt(k){
  if(!k)throw new Error('kt: empty key');
  if(HONOR_KEYS.has(k))return {k,t:'honor',s:k,v:0};
  const sk=k.slice(0,k.length-1),v=parseInt(k.slice(-1),10);
  if(!SUIT_KEYS.has(sk)||!Number.isInteger(v)||v<1||v>9)throw new Error('kt: invalid key "'+k+'"');
  return {k,t:'num',s:sk,v:v};
}
function ruleTiles(hand){return hand.map(tkey);}
function ruleMeldsFromPlayer(player){
  return (player.melds||[]).map(function(m){
    const tile=tkey(m.tile);
    const type=m.count===4?(m.concealed?'anGang':'mingGang'):'peng';
    return {type:type,tiles:m.count===4?[tile,tile,tile,tile]:[tile,tile,tile],fromPlayer:m.fromPlayer};
  });
}
function ruleMeldsForPlayer(playerIdx){return ruleMeldsFromPlayer(GS.players[playerIdx]||{});}
function createPageKongResource(owner,tile,fromPlayer){
  const key=tkey(tile);
  return RULE_ENGINE.createKongResource({
    owner:owner,
    tile:key,
    pongMeld:{type:'peng',tiles:[key,key,key],fromPlayer:fromPlayer},
    source:'pong'
  });
}
function classifyPageDiscardKongAction(player,discard,owner,discardPlayer){
  return RULE_ENGINE.classifyDiscardKongClaim({
    hand:ruleTiles((player&&player.hand)||[]),
    melds:ruleMeldsFromPlayer(player||{}),
    discardTile:tkey(discard),
    owner:owner,
    discardPlayer:discardPlayer
  });
}
function transitionPageKongResources(resources,event){
  return (Array.isArray(resources)?resources:[]).map(function(resource){
    return RULE_ENGINE.transitionKongResource(resource,event);
  });
}
function resolvePageKongAction(input){
  const resolution=RULE_ENGINE.resolveKongDraw(input.action);
  if(resolution.outcome==='forcedRunFailureDiscard')return {resolution:resolution,settlement:null};
  return {
    resolution:resolution,
    settlement:RULE_ENGINE.scoreKongSettlement({
      action:input.action,
      winner:input.winner,
      pointKongPlayer:input.pointKongPlayer,
      scores:input.scores
    })
  };
}
function resolvePageSpecialKongAction(input){
  const resolution=RULE_ENGINE.resolveSpecialKongAction(input.action);
  if(resolution.mustDiscard)return {resolution:resolution,settlement:null};
  return {resolution:resolution,settlement:RULE_ENGINE.scoreSpecialKongSettlement({action:input.action,winner:input.winner,scores:input.scores})};
}
function preflightPageSpecialKongResolution(action,owner){
  if(!action||!action.input||!Array.isArray(GS.wall)||!Array.isArray(GS.players))return null;
  const drawTile=GS.wall[GS.wall.length-1];
  if(!drawTile)return null;
  const replayAction={kind:action.kind,input:Object.assign({},action.input,{drawTile:tkey(drawTile)})};
  try{
    const result=resolvePageSpecialKongAction({action:replayAction,winner:owner,scores:GS.players.map(function(item){return item.score;})});
    return result&&result.resolution?{drawTile:drawTile,replayAction:replayAction,result:result}:null;
  }catch(error){return null;}
}
function isPageSpecialKongCommitResultValid(action,result){
  const outcome=result&&result.resolution&&result.resolution.outcome;
  const hasSettlement=hasPageKongSettlementContract(result&&result.settlement);
  if(!action||typeof action.kind!=='string')return false;
  if(action.kind==='postPongCandidateConcealedKong')return (outcome==='postPongCandidateConcealedTrueWin'||outcome==='postPongCandidateConcealedFakeWin')&&hasSettlement;
  if(action.kind==='addedKongChain')return (outcome==='addedKongChainTrueWin'||outcome==='addedKongChainFakeWin')&&hasSettlement;
  if(action.kind==='forcedRunConcealed'||action.kind==='doublePongForcedRun'){

    tileLabel:tile?lbl(tile):null,
    hand:GS.players[p]?GS.players[p].hand.map(t=>tkey(t)).join(',') : ''
  },extra||{}));
}
function buildKeyDecisionSummary(result){
  const log=ensureRecommendationLog();
  if(!log)return null;
  const recommendationSummary=log.recommendationSummary||RECOMMENDATION_ENGINE.summarizeRecords(log.recommendationRecords||[]);
  const aiSummary=Array.isArray(log.aiDecisionSummary)?log.aiDecisionSummary:[];
  const anomalies=Array.isArray(log.aiDecisionAnomalies)?log.aiDecisionAnomalies:[];
  const keyPoints=[];
  (log.recommendationRecords||[]).slice(-5).forEach(function(record){
    keyPoints.push({
      turn:record.turn,
      type:record.type,
      actualAction:record.actualAction||null,
      recommendedAction:record.recommendedAction,
      reasonSummary:(record.reasons||[]).join('；').slice(0,180),
      severity:record.strategyGap&&record.strategyGap.includes('明显')?'medium':'low',
      needsReview:record.adopted===false||!!(record.strategyGap&&record.strategyGap.includes('明显'))
    });
  });
  aiSummary.slice(-5).forEach(function(item){
    keyPoints.push({
      turn:item.turn,
      type:'ai-discard',
      player:item.player,
      actualAction:'打'+item.discardLabel,
      recommendedAction:'打'+item.discardLabel,
      shantenAfter:item.shantenAfter,
      reasonSummary:item.mainReason,
      severity:item.needsReview?'high':'low',
      needsReview:!!item.needsReview
    });
  });
  return {
    schemaVersion:'stage7-key-decision-summary-v1',
    result:result||null,
    totalTurns:GS.turn||0,
    recommendationQuality:{
      total:recommendationSummary.total||0,
      highConfidenceMissed:recommendationSummary.highConfidenceMissed||0,
      candidateInconsistencies:0,
      explanationInconsistencies:0,
      aiRecommendationDivergences:anomalies.filter(function(item){return item.reasonCode==='ai-recommendation-divergence';}).length
    },
    aiDiscardSummary:{
      total:aiSummary.length,
      needsReview:aiSummary.filter(function(item){return item.needsReview;}).length,
      anomalies:anomalies.length
    },
    keyPoints:keyPoints.slice(-8),
    abnormalFlags:{
      invalidWins:log.invalidWins||0,
      suspiciousWins:log.suspiciousWins||0,
      illegalActions:log.illegalActions||0,
      settlementErrors:log.settlementErrors||0,
      logCompleteness:log.events&&log.events.length?'complete':'empty'
    }
  };
}
function saveGameLog(result){
  if(!GS._gameLog)return;
  ensureRecommendationLog();
  GS._gameLog.result=result;
  GS._gameLog.keyDecisionSummary=buildKeyDecisionSummary(result);
  GS._gameLog.endTime=new Date().toLocaleString();
  let logs=[];
  try{logs=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){console.warn('[game log] read failed before save',e);}
  logs=logs.filter(function(log){return !log||log.gameId!==GS._gameLog.gameId;});
  logs.unshift(GS._gameLog);
  if(logs.length>1)logs=logs.slice(0,1);
  try{localStorage.setItem(LOG_KEY,JSON.stringify(logs));}catch(e){console.warn('[game log] save failed',e);}
  GS._gameLog=null;
}
function downloadGameLogFallback(exportLogs,currentLog){
  const text=JSON.stringify(exportLogs,null,2);
  const blob=new Blob([text],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='万年麻将_第'+currentLog.gameSequence+'局_'+currentLog.gameId+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  gameSetTimeout(function(){URL.revokeObjectURL(url);},1000);
}
async function exportGameLogs(){
  let logs=[];
  try{logs=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){console.warn('[game log] read failed before export',e);alert('导出失败：读取本地游戏记录失败，请检查浏览器 localStorage 是否可用。');return;}
  const currentLog=(GS._gameLog&&GS._gameLog.events&&GS._gameLog.events.length>0)?GS._gameLog:(logs[0]||null);
  const exportLogs=currentLog?[currentLog]:[];
  if(!exportLogs.length){alert('暂无游戏记录');return;}
  const record=exportLogs[0];
  if(!Number.isInteger(record.gameSequence)||record.gameSequence<1){alert('导出失败：当前对局缺少稳定局号，请开始新局后再导出。');return;}
  try{
    const response=await fetch('/api/game/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schemaVersion:'wannian-game-record-export-v2',gameSequence:record.gameSequence,gameId:record.gameId,record:record})});
    const result=await response.json();
    if(!response.ok||!result||result.ok!==true)throw new Error(result&&result.error?result.error:'server-export-failed');
    alert('记录已写入受控导出目录：'+result.filename);
  }catch(e){
    console.error('[game log] export failed',e);
    if(confirm('服务端导出失败。是否改用浏览器下载作为降级方式？浏览器无法保证保存到受控目录。')){
      try{downloadGameLogFallback(exportLogs,record);}catch(fallbackError){console.error('[game log] fallback download failed',fallbackError);alert('导出失败：生成或下载 JSON 文件失败，请查看浏览器控制台的 [game log] export failed 日志定位原因。');}
    }
  }
}

const canvas=document.getElementById('c');
canvas.width=W;canvas.height=H;
const ctx=canvas.getContext('2d');

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

// Chinese number mapping and honor characters (中至麻将风格)
const CN=['零','一','二','三','四','五','六','七','八','九'];
const HC={dong:'東',nan:'南',xi:'西',bei:'北',zhong:'中',fa:'發',bai:'白'};

// draw tile - 中至麻将拟物化风格 (白底+顶部绿色窄边框圆角矩形，轻微立体厚度)
function drawTile(x,y,tile,opts={}){
  const {sel=false,face=true,small=false,alpha=1,hl=false,disc=false,match=false}=opts;
  const tw=small?33:TW,th=small?45:TH;
  ctx.save();ctx.globalAlpha=alpha;

  // 1. 投影
  ctx.shadowColor='rgba(0,0,0,0.45)';
  ctx.shadowBlur=5;
  ctx.shadowOffsetX=1;
  ctx.shadowOffsetY=2;

  // 2. 牌体 (米白圆角矩形)
  ctx.fillStyle='#fffef5';
  roundRect(ctx,x,y,tw,th,5);
  ctx.fill();

  ctx.shadowColor='transparent';

  // 3. 顶部绿色窄边框 (2px)
  ctx.fillStyle='#1a5c2a';
  ctx.beginPath();
  ctx.moveTo(x+5,y);
  ctx.lineTo(x+tw-5,y);
  ctx.lineTo(x+tw,y+2);
  ctx.lineTo(x,y+2);
  ctx.lineTo(x+5,y);
  ctx.fill();

  // 4. 右侧立体边框 (2px)
  ctx.fillStyle='#2e7d32';
  ctx.fillRect(x+tw-2,y,2,th);

  // 5. 光泽渐变 (左上角高光，覆盖上半部)
  const glow=ctx.createLinearGradient(x,y,x,y+th*0.4);
  glow.addColorStop(0,'rgba(255,255,255,0.25)');
  glow.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=glow;
  roundRect(ctx,x,y,tw,th*0.4,5);
  ctx.fill();

  // 6. 底部绿色厚度线
  ctx.fillStyle='#0d4a20';
  ctx.fillRect(x+2,y+th-2,tw-4,2);

  // 7. 选中状态 - 金色边框
  if(sel){
    ctx.strokeStyle='#ffd700';
    ctx.lineWidth=2;
    roundRect(ctx,x+1,y+1,tw-2,th-2,5);
    ctx.stroke();
  }

  // 8. 高亮状态
  if(hl){
    ctx.strokeStyle='#00ff00';
    ctx.lineWidth=2;
    roundRect(ctx,x+1,y+1,tw-2,th-2,5);
    ctx.stroke();
  }

  // 9. 弃牌抬升高亮 (红框)
  if(disc){
    ctx.strokeStyle='#ff1744';
    ctx.lineWidth=3;
    roundRect(ctx,x+2,y+2,tw-4,th-4,5);
    ctx.stroke();
  }

  // Same-tile public highlight.
  if(match){
    ctx.strokeStyle='#ffd54f';
    ctx.lineWidth=4;
    roundRect(ctx,x,y,tw,th-2,6);
    ctx.stroke();
  }

  if(!face){
    // 牌背 - 中至麻将风格 (绿色底+白色圆形徽章)
    const bgG=ctx.createLinearGradient(x+2,y+2,x+tw-2,y+th-2);
    bgG.addColorStop(0,'#1a5c2a');
    bgG.addColorStop(0.5,'#145a28');
    bgG.addColorStop(1,'#0d4a20');
    ctx.fillStyle=bgG;
    roundRect(ctx,x+2,y+2,tw-4,th-4,4);
    ctx.fill();
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=1.5;
    roundRect(ctx,x+2.5,y+2.5,tw-5,th-5,4);
    ctx.stroke();
    
    // 中心白色圆形徽章
    const cx=x+tw/2,cy=y+th/2;
    const radius=small?10:15;
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.fillStyle='#ffffff';
    ctx.fill();
    ctx.strokeStyle='#1a5c2a';
    ctx.lineWidth=1.2;
    ctx.stroke();
    
    // 徽章内绿色叶子图案
    ctx.fillStyle='#1a5c2a';
    ctx.strokeStyle='#1a5c2a';
    ctx.lineWidth=1;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    const r=radius*0.55;
    // 中心茎
    ctx.beginPath();
    ctx.moveTo(cx,cy-r);
    ctx.lineTo(cx,cy+r);
    ctx.stroke();
    // 左上叶片
    ctx.beginPath();
    ctx.moveTo(cx,cy-r*0.5);
    ctx.quadraticCurveTo(cx-r*0.7,cy-r*0.3,cx-r*0.1,cy);
    ctx.quadraticCurveTo(cx-r*0.3,cy+r*0.4,cx,cy+r*0.3);
    ctx.fill();
    // 右上叶片
    ctx.beginPath();
    ctx.moveTo(cx,cy-r*0.5);
    ctx.quadraticCurveTo(cx+r*0.7,cy-r*0.3,cx+r*0.1,cy);
    ctx.quadraticCurveTo(cx+r*0.3,cy+r*0.4,cx,cy+r*0.3);
    ctx.fill();
    // 下方小芽
    ctx.beginPath();
    ctx.moveTo(cx,cy+r*0.15);
    ctx.quadraticCurveTo(cx-r*0.4,cy+r*0.7,cx,cy+r);
    ctx.quadraticCurveTo(cx+r*0.4,cy+r*0.7,cx,cy+r*0.15);
    ctx.fill();
  }else{
    // 牌面内容 - 使用图片纹理
    const cx=x+tw/2, cy=y+th/2;
    const sc=small?0.75:1;
    
    // 获取纹理图片
    let imgKey = '';
    if(tile.t==='num'){
      // player hand uses 'wan'/'tong'/'tiao' suits
      const suitKey = tile.s === 'tong' ? 'tong' : tile.s;
      imgKey = `${suitKey}_${tile.v}`;
    }else{
      // 字牌直接用名称 (dong, nan, xi, bei, zhong, fa, bai)
      imgKey = tile.s;
    }
    
    const img = tileImages[imgKey];
    if(img){
      // 计算绘制尺寸，保持比例自适应
      const imgW = img.naturalWidth || img.width;
      const imgH = img.naturalHeight || img.height;
      const targetW = tw * 0.8;
      const targetH = targetW * imgH / imgW;
      ctx.drawImage(img, cx - targetW/2, cy - targetH/2, targetW, targetH);
    }else{
      // 图片未加载时降级为原始绘制
      if(tile.t==='num'){
        if(tile.s==='wan') drawMan(cx,cy,tile.v,sc);
        else if(tile.s==='tong') drawTong(cx,cy,tile.v,sc);
        else drawTiao(cx,cy,tile.v,sc);
      }else{
        drawHonor(cx,cy,tile,sc);
      }
    }
  }
  ctx.restore();
}

// ---- 中至麻将风格牌面绘制 ----

function drawMan(cx,cy,v,s){
  // 万子: 上黑色数字 + 下红色"萬"字，上下结构，大小一致
  const fontSize=20*s;
  const spacing=10*s;
  
  // 黑色数字 (上方)
  ctx.fillStyle='#1a1a1a';
  ctx.font=`bold ${fontSize}px "SimHei","Microsoft YaHei","KaiTi",serif`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(CN[v],cx,cy-spacing);
  
  // 红色"萬"字 (下方) - 同样大小
  ctx.fillStyle='#c62828';
  ctx.font=`bold ${fontSize}px "SimHei","Microsoft YaHei","KaiTi",serif`;
  ctx.fillText('萬',cx,cy+spacing);
}

// 牌面图片预加载 - 使用纹理版牌面
const tileImages = {};
function loadTileImages() {
  const promises = [];
  
  // 万子 (1-9)
  for (let value = 1; value <= 9; value++) {
    promises.push(loadImage(`wan_${value.toString().padStart(2, '0')}.png`, `wan_${value}`));
  }
  
  // 筒子 (1-9)
  for (let value = 1; value <= 9; value++) {
    promises.push(loadImage(`bing_${value.toString().padStart(2, '0')}.png`, `tong_${value}`));
  }
  
  // 条子 (1-9)
  for (let value = 1; value <= 9; value++) {
    promises.push(loadImage(`tiao_${value.toString().padStart(2, '0')}.png`, `tiao_${value}`));
  }
  
  // 字牌
  const ziMap = [
    { file: 'zi_东.png', key: 'dong' },
    { file: 'zi_南.png', key: 'nan' },
    { file: 'zi_西.png', key: 'xi' },
    { file: 'zi_北.png', key: 'bei' },
    { file: 'zi_中.png', key: 'zhong' },
    { file: 'zi_发.png', key: 'fa' },
    { file: 'zi_白.png', key: 'bai' }
  ];
  
  for (const { file, key } of ziMap) {
    promises.push(loadImage(file, key));
  }
  
  return Promise.all(promises);
}

function loadImage(filename, key) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      tileImages[key] = img;
      resolve();
    };
    img.onerror = () => {
      console.warn(`纹理图片加载失败: ${filename}`);
      resolve();
    };
    img.src = '/game/' + filename;
  });
}

function drawTong(cx,cy,v,s){
  // 筒子: 黑色同心圆环+中心实心
  const outerR=5*s;
  const innerR=3.5*s;
  const centerR=1.8*s;
  const spacing=12*s;
  
  const layouts={
    1:[[0,0]],
    2:[[0,-spacing/2],[0,spacing/2]],
    3:[[-spacing/2,-spacing/2],[spacing/2,-spacing/2],[0,spacing/2]],
    4:[[-spacing/2,-spacing/2],[spacing/2,-spacing/2],[-spacing/2,spacing/2],[spacing/2,spacing/2]],
    5:[[-spacing,-spacing],[spacing,-spacing],[0,0],[-spacing,spacing],[spacing,spacing]],
    6:[[-spacing,-spacing*1.2],[-spacing,0],[-spacing,spacing*1.2],[spacing,-spacing*1.2],[spacing,0],[spacing,spacing*1.2]],
    7:[[-spacing,-spacing*1.2],[-spacing,0],[-spacing,spacing*1.2],[0,0],[spacing,-spacing*1.2],[spacing,0],[spacing,spacing*1.2]],
    8:[[-spacing,-spacing*1.4],[-spacing,-spacing*0.4],[-spacing,spacing*0.4],[-spacing,spacing*1.4],[spacing,-spacing*1.4],[spacing,-spacing*0.4],[spacing,spacing*0.4],[spacing,spacing*1.4]],
    9:[[-spacing,-spacing*1.2],[-spacing,0],[-spacing,spacing*1.2],[0,-spacing*1.2],[0,0],[0,spacing*1.2],[spacing,-spacing*1.2],[spacing,0],[spacing,spacing*1.2]]
  };
  
  for(let [dx,dy] of layouts[v]){
    const px=cx+dx, py=cy+dy;
    
    if(v===1){
      // 使用图片作为一饼牌面
      if(oneDotImg){
        const imgWidth = oneDotImg.width;
        const imgHeight = oneDotImg.height;
        const targetWidth = TH * 0.8 * s; // 牌高TH=72, 占80%
        const targetHeight = targetWidth * imgHeight / imgWidth;
        ctx.drawImage(oneDotImg, px - targetWidth/2, py - targetHeight/2, targetWidth, targetHeight);
      }else{
        // 图片未加载时降级为简单圆
        ctx.beginPath();
        ctx.arc(px, py, 10*s, 0, Math.PI*2);
        ctx.fillStyle = '#c80000';
        ctx.fill();
      }
    }else{
      // 其他筒子保持原样
      // 外圈 - 黑色
      ctx.beginPath();ctx.arc(px,py,outerR,0,Math.PI*2);
      ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.2*s;ctx.stroke();
      // 中环 - 底色间隔 (擦除/覆盖为牌底色)
      ctx.beginPath();ctx.arc(px,py,innerR+0.5*s,0,Math.PI*2);
      ctx.strokeStyle='#fdf8ed';ctx.lineWidth=1.5*s;ctx.stroke();
      // 内圈 - 黑色
      ctx.beginPath();ctx.arc(px,py,innerR,0,Math.PI*2);
      ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1*s;ctx.stroke();
      // 中心实心 - 黑色
      ctx.beginPath();ctx.arc(px,py,centerR,0,Math.PI*2);
      ctx.fillStyle='#1a1a1a';ctx.fill();
    }
  }
}

function drawTiao(cx,cy,v,s){
  // 条子: 绿色竹节形 + 红色中心点，纵向排列
  const barW=3.5*s, barH=7*s;  // 竹节宽高
  const spacing=9*s;
  
  if(v===1){
    // 1条: 特殊图案 (鸟/蛇形) - 绿色
    ctx.strokeStyle='#2e7d32';
    ctx.lineWidth=1.5*s;
    ctx.lineCap='round';
    const top=cy-14*s, bot=cy+14*s;
    ctx.beginPath();
    ctx.moveTo(cx,top);
    ctx.quadraticCurveTo(cx+8*s,top+8*s,cx,top+14*s);
    ctx.quadraticCurveTo(cx-8*s,bot-8*s,cx,bot);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx,bot-3*s,2*s,0,Math.PI*2);
    ctx.fillStyle='#2e7d32';ctx.fill();
  }else{
    // 2-9条: 纵向排列绿色竹节+红色中心点
    const count=v;
    const totalHeight=(count-1)*spacing;
    const startY=cy-totalHeight/2;
    
    for(let i=0;i<count;i++){
      const sy=startY+i*spacing;
      // 绿色竹节外框 (圆角矩形)
      ctx.fillStyle='#2e7d32';
      roundRect(ctx,cx-barW,sy-barH,barW*2,barH*2,1.5*s,false);
      // 红色中心点
      ctx.beginPath();
      ctx.arc(cx,sy,1.8*s,0,Math.PI*2);
      ctx.fillStyle='#c62828';
      ctx.fill();
    }
  }
}

function drawHonor(cx,cy,tile,s){
  const ch=HC[tile.s];
  const size=32*s;
  
  if(tile.s==='bai'){
    // 白 - 空心方框
    const w=20*s, h=28*s;
    ctx.strokeStyle='#1a1a1a';
    ctx.lineWidth=2*s;
    ctx.strokeRect(cx-w/2,cy-h/2,w,h);
    return;
  }
  
  let color='#1a1a1a';
  if(tile.s==='zhong')color='#af0a02';
  else if(tile.s==='fa')color='#2e7d32';
  
  ctx.fillStyle=color;
  ctx.font=`bold ${size}px "SimHei","Microsoft YaHei","KaiTi",serif`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(ch,cx,cy);
}

// helper: rounded rectangle
function roundRect(ctx,x,y,w,h,r,strokeOnly){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  if(strokeOnly)ctx.stroke();else ctx.fill();
}

function render(){
  updateTopScoreBar();
  ctx.clearRect(0,0,W,H);
  // green felt
  const rg=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,700);
  rg.addColorStop(0,'#0d7a0d');rg.addColorStop(1,'#053d05');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#6d4c00';ctx.lineWidth=14;ctx.strokeRect(7,7,W-14,H-14);
  ctx.strokeStyle='#8b6914';ctx.lineWidth=3;ctx.strokeRect(10,10,W-20,H-20);

  if(GS.phase==='idle')return;
  GS._hot=[];
  const selectedKey=GS._recommendation&&GS._recommendation.selectedTileKey;

  // player hand (bottom)
  // 构建手牌副本，排除新摸的牌（已在手牌中，单独显示）
  const fullHand = [...GS.players[0].hand];
  const hasNewDrawn = GS.phase==='discarding' && GS.newDrawnTile && GS.cur===0;
  if(hasNewDrawn){
    const ndtIdx = fullHand.indexOf(GS.newDrawnTile);
    if(ndtIdx >= 0) fullHand.splice(ndtIdx, 1);
  }
  const ph=fullHand.sort(tcmp);
  const pw=ph.length*(TW+GAP);
  let sx=W/2-pw/2;
  const selectedTile=getSelectedTile();
  
  for(let i=0;i<ph.length;i++){
    const tx=sx+i*(TW+GAP);
    const isSelected=selectedTile===ph[i];
    const yo=isSelected?-12:0;
    drawTile(tx,H-TH-45+yo,ph[i],{sel:isSelected});
    GS._hot.push({x:tx,y:H-TH-45+yo,w:TW,h:TH,idx:i,t:ph[i]});
  }
  
  // 绘制新摸的牌（在最右边，与手牌隔开）
  if(hasNewDrawn){
    const newTileGap = 30; // 新牌与手牌的间隔
    const newTileX = sx + ph.length*(TW+GAP) + newTileGap;
    const isSelected=selectedTile===GS.newDrawnTile;
    const yo = isSelected ? -12 : 0;
    drawTile(newTileX, H-TH-45+yo, GS.newDrawnTile, {sel:isSelected, hl:true});
    GS._hot.push({x:newTileX, y:H-TH-45+yo, w:TW, h:TH, idx:GS.newDrawnIdx, t:GS.newDrawnTile});
    
    // 绘制分隔线
    const sepX = sx + ph.length*(TW+GAP) + newTileGap/2 - 1;
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(sepX, H-TH-45-10);
    ctx.lineTo(sepX, H-TH-45+TH+10);
    ctx.stroke();
  }

  // 碰/杠展示 - 底部玩家 (p=0)
  const m0=GS.players[0].melds||[];
  if(m0.length){
    let mx=sx,my=H-TH-45-5-45;
    for(let mi=0;mi<m0.length;mi++){
      const meld=m0[mi];
      for(let j=0;j<meld.count;j++)drawTile(mx+j*34,my,meld.tile,{face:true,small:true,match:!!(selectedKey&&tkey(meld.tile)===selectedKey)});
      mx+=meld.count*34+5;
    }
  }

  // AI hands
  // p=2 对家：横排（顶部）
  const h2=aiDisplayHand(2);
  const tw2=h2.length*(TW+GAP);
  let sx2=W/2-tw2/2;
  for(let i=0;i<h2.length;i++){
    const yo=(GS._aiDiscardAnim&&GS._aiDiscardAnim.p===2&&GS._aiDiscardAnim.idx===i)?+12:0;
    drawTile(sx2+i*(TW+GAP),45+yo,h2[i],{face:!!GS.showAI,hl:aiDrawHighlight(2,h2[i]),disc:!!(GS.showAI&&GS._aiDiscardAnim&&GS._aiDiscardAnim.p===2&&GS._aiDiscardAnim.idx===i)});
  }
  
  // 碰/杠展示 - 顶部玩家 (p=2)
  const m2=GS.players[2].melds||[];
  if(m2.length){
    let mx=sx2,my=45+TH+5;
    for(let mi=0;mi<m2.length;mi++){
      const meld=m2[mi];
      for(let j=0;j<meld.count;j++)drawTile(mx+j*34,my,meld.tile,{face:true,small:true,match:!!(selectedKey&&tkey(meld.tile)===selectedKey)});
      mx+=meld.count*34+5;
    }
  }
  
  // p=3 上家（左侧）竖排
  const h3=aiDisplayHand(3);
  const startY3=H/2-h3.length*(TW+GAP)/2;
  for(let i=0;i<h3.length;i++){
    const ty=startY3+i*(TW+GAP);
    const lift=(GS._aiDiscardAnim&&GS._aiDiscardAnim.p===3&&GS._aiDiscardAnim.idx===i)?-10:0;
    ctx.save();
    ctx.translate(35, ty);
    ctx.rotate(Math.PI/2);
    drawTile(0,-TH+lift,h3[i],{face:!!GS.showAI,hl:aiDrawHighlight(3,h3[i]),disc:!!(GS.showAI&&GS._aiDiscardAnim&&GS._aiDiscardAnim.p===3&&GS._aiDiscardAnim.idx===i)});
    ctx.restore();
  }
  
  // 碰/杠展示 - 左侧玩家 (p=3)
  const m3=GS.players[3].melds||[];
  if(m3.length){
    let my=startY3;
    for(let mi=0;mi<m3.length;mi++){
      const meld=m3[mi];
      for(let j=0;j<meld.count;j++){
        const ty=my+j*34;
        ctx.save();
        ctx.translate(35+TH+5,ty);
        ctx.rotate(Math.PI/2);
        drawTile(0,-45,meld.tile,{face:true,small:true,match:!!(selectedKey&&tkey(meld.tile)===selectedKey)});
        ctx.restore();
      }
      my+=meld.count*34+5;
    }
  }
  
  // p=1 下家（右侧）竖排
  const h1=aiDisplayHand(1);
  const startY1=H/2-h1.length*(TW+GAP)/2;
  for(let i=0;i<h1.length;i++){
    const ty=startY1+i*(TW+GAP);
    const lift=(GS._aiDiscardAnim&&GS._aiDiscardAnim.p===1&&GS._aiDiscardAnim.idx===i)?+10:0;
    ctx.save();
    ctx.translate(W-45, ty);
    ctx.rotate(Math.PI/2);
    drawTile(0,0+lift,h1[i],{face:!!GS.showAI,hl:aiDrawHighlight(1,h1[i]),disc:!!(GS.showAI&&GS._aiDiscardAnim&&GS._aiDiscardAnim.p===1&&GS._aiDiscardAnim.idx===i)});
    ctx.restore();
  }

  // 碰/杠展示 - 右侧玩家 (p=1)
  const m1=GS.players[1].melds||[];
  if(m1.length){
    let my=startY1;
    for(let mi=0;mi<m1.length;mi++){
      const meld=m1[mi];
      for(let j=0;j<meld.count;j++){
        const ty=my+j*34;
        ctx.save();
        ctx.translate(W-45-TH-5,ty);
        ctx.rotate(Math.PI/2);
        drawTile(0,0,meld.tile,{face:true,small:true,match:!!(selectedKey&&tkey(meld.tile)===selectedKey)});
        ctx.restore();
      }
      my+=meld.count*34+5;
    }
  }

  // discard zone
  const drawDiscardRow=(px,py,discards,rotation=0)=>{
    if(!discards.length)return;
    const stw=33, sth=45;
    const sgap=1, vgap=2;
    const perRow=8;
    ctx.save();
    if(rotation){
      ctx.translate(px,py);
      ctx.rotate(rotation);
    }
    const ox=rotation?0:px;
    const oy=rotation?0:py;
    for(let i=0;i<discards.length;i++){
      const col=i%perRow;
      const row=Math.floor(i/perRow);
      const tx=ox+col*(stw+sgap);
      const ty=oy+row*(sth+vgap);
      drawTile(tx,ty,discards[i],{small:true,match:!!(selectedKey&&tkey(discards[i])===selectedKey)});
    }
    ctx.restore();
  };
  
  // Player 0 (bottom): discard starting from red-box position, left to right
  const d0=GS.playerDiscards[0];
  drawDiscardRow(554, 586, d0);
  
  // Player 2 (top): discard starting from red-box position (top-right), left to right from their view
  const d2=GS.playerDiscards[2];
  drawDiscardRow(807, 314, d2, Math.PI);
  
  // Player 3 (left): discard starting from red-box position, vertical downward
  const d3=GS.playerDiscards[3];
  if(d3.length){
    drawDiscardRow(544, 324, d3, Math.PI/2);
  }
  
  // Player 1 (right): discard starting from red-box position, vertical upward
  const d1=GS.playerDiscards[1];
  if(d1.length){
    drawDiscardRow(816, 577, d1, -Math.PI/2);
  }
  
  // wall count + cur indicator
  ctx.fillStyle='#fff';ctx.font='13px Microsoft YaHei';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(`牌墙: ${GS.wall.length}张`,W/2,H/2);
  const arrows=[{x:W/2,y:H-TH-45},{x:W-75,y:H/2},{x:W/2,y:15},{x:75,y:H/2}];
  const ap=arrows[GS.cur];
  ctx.fillStyle='gold';ctx.font='16px Microsoft YaHei';ctx.fillText('▼',ap.x,ap.y);
}

// -- win check --
function isTermHonor(t){return t.t==='honor'||t.v===1||t.v===9;}
function handPts(hand){
  let pts=0;const c={};hand.forEach(t=>{const k=tkey(t);c[k]=(c[k]||0)+1;});
  for(let k in c){
    if(c[k]>=3){const t=hand.find(h=>tkey(h)===k);pts+=isTermHonor(t)?(c[k]===4?8:4):(c[k]===4?4:2);}
  }
  return pts;
}
function meetsThresh(hand, winTile, winType){
  if(isSpecial(hand))return true;
  if(winType==='杠开')return true;
  // 天胡地胡不受限制
  if(!winTile)return true;
  // 字牌可胡
  if(winTile.t==='honor')return true;
  // 序数牌须 >=5
  return winTile.v>=5;
}

function isSpecial(hand){
  const result=RULE_ENGINE.canWin(ruleTiles(hand),{});
  return !!(result&&result.canWin&&['sevenPairs','allHonor','dalan','banzhengzong','quanzhengzong'].includes(result.route));
}

function effectiveHand(p){
  const h=[...GS.players[p].hand];
  const melds=GS.players[p].melds||[];
  for(let m of melds){
    const c=m.count===4?3:m.count;
    for(let i=0;i<c;i++)h.push(m.tile);
  }
  return h;
}
function concealedHand(p){
  return [...((GS.players[p]&&GS.players[p].hand)||[])];
}

function canHuNormal(hand,useWild,preMelds,winTile,winType){
  const s=hand.map(tkey);
  const ruleContext={melds:normalizedRuleMelds(preMelds),winTile:winTile?tkey(winTile):undefined,winType:winType};
  const ruleResult=RULE_ENGINE.canWin(s,ruleContext);
  if(ruleResult&&ruleResult.canWin)return {win:true,useWild:false,type:ruleResult.handType,handTypes:ruleResult.handTypes,baseScore:ruleResult.baseScore,route:ruleResult.route};
  if(useWild){
    const drawKey=winTile?tkey(winTile):s[s.length-1];
    const wildResult=RULE_ENGINE.resolveWildcard(s,ruleContext.melds,drawKey);
    if(wildResult&&(wildResult.isTrueWin||wildResult.isFakeWin))return {win:true,useWild:!wildResult.isTrueWin,type:wildResult.isFakeWin?'假胡':(ruleResult&&ruleResult.handType)||'平胡',handTypes:wildResult.isFakeWin?['假胡']:((ruleResult&&ruleResult.handTypes)||['平胡']),baseScore:(ruleResult&&ruleResult.baseScore)||1};
  }
  return false;
}

// Build a read-only response-phase view without mutating the live game state.
function responseResolutionState(state){
  return Object.assign({},state,{phase:'responding'});
}

// Resolve discard responses from live state without UI, timers, or persistence side effects.
function resolveDiscardResponses(state){
  const players=(state&&Array.isArray(state.players))?state.players:[];
  const discard=state&&state.lastDiscard;
  const discarder=state&&state.lastDiscardP;
  if(!discard||!Number.isInteger(discarder)||discarder<0||discarder>=players.length){
    return {responses:[],responder:-1,kind:'calls',canP:false,canK:false,canW:false,reason:'missing-discard-context'};
  }
  const responses=[];
  for(let i=0;i<players.length;i++){
    if(i===discarder)continue;
    const legal=RULE_ENGINE.getLegalActions(pageRuleState(state),i);
    const kongKind=legal.includes('directChisel')?'directChisel':legal.includes('forcedRunKong')?'forcedRunImmediate':null;
    responses.push({
      p:i,
      cw:legal.includes('win')&&canWinAfterPassForState(state,i,discard),
      cp:legal.includes('pong'),
      ck:!!kongKind,
      kongKind:kongKind
    });
  }
  const winners=responses.filter(function(response){return response.cw;});
  if(winners.length){
    let responder=null;
    for(let offset=1;offset<players.length;offset++){
      const playerIdx=(discarder+offset)%players.length;
      if(winners.some(function(response){return response.p===playerIdx;})){responder=playerIdx;break;}
    }
    if(responder===null)responder=winners[0].p;
    return {responses:responses,responder:responder,kind:'win',canP:false,canK:false,canW:true,reason:'legal-win-response'};
  }
  const humanCall=responses.find(function(response){return players[response.p]&&players[response.p].human&&(response.cp||response.ck);});
  return {
    responses:responses,
    responder:humanCall?humanCall.p:-1,
    kind:'calls',
    canP:!!(humanCall&&humanCall.cp),
    canK:!!(humanCall&&humanCall.ck),
    canW:false,
    reason:humanCall?'legal-human-call-response':'no-human-response'
  };
}

function revalidateRestoredResponseState(state){
  if(!state||state.phase!=='responding')return {applied:false,reason:'not-responding'};
  const previousWin=!!state.canW&&state._responseKind==='win';
  const resolved=resolveDiscardResponses(state);
  state.canP=resolved.canP;
  state.canK=resolved.canK;
  state.canW=resolved.canW;
  state._resp=resolved.kind==='calls'?resolved.responses:null;
  state._respP=resolved.responder;
  state._responseKind=resolved.kind;
  return {applied:true,reason:previousWin&&!resolved.canW?'stale-win-cleared':resolved.reason};
}
function revalidateRestoredKongState(state){
  if(!state)return {applied:false,reason:'missing-state'};
  const resources=Array.isArray(state._kongResources)?state._kongResources:[];
  let invalidated=0;
  state._kongResources=resources.map(function(resource){
    if(!resource||resource.status!=='active')return resource;
    const player=state.players&&state.players[resource.owner];
    const hasPong=!!(player&&Array.isArray(player.melds)&&player.melds.some(function(meld){return meld.count===3&&teq(meld.tile,kt(resource.tile));}));
    const keepsTile=!!(player&&Array.isArray(player.hand)&&player.hand.some(function(tile){return tkey(tile)===resource.tile;}));
    if(hasPong&&keepsTile)return resource;
    invalidated++;
    return RULE_ENGINE.invalidateKongResource(resource);
  });
  const candidateResources=Array.isArray(state._candidateKongResources)?state._candidateKongResources:[];
  state._candidateKongResources=candidateResources.map(function(resource){
    if(!resource||resource.status!=='active')return resource;
    const player=state.players&&state.players[resource.owner];
    const hasPong=!!(player&&Array.isArray(player.melds)&&player.melds.some(function(meld){return meld.count===3&&teq(meld.tile,kt(resource.pongMeld&&resource.pongMeld.tiles&&resource.pongMeld.tiles[0]))&&meld.fromPlayer===resource.pongMeld.fromPlayer;}));
    const keepsCandidate=!!(player&&Array.isArray(player.hand)&&player.hand.filter(function(tile){return tkey(tile)===resource.candidateKongTile;}).length===4);
    if(hasPong&&keepsCandidate)return resource;
    invalidated++;
    return Object.assign({},resource,{status:'invalidated'});
  });
  if(state._specialKongChoiceWindow){
    const choiceOwner=state.players&&state.players[state._specialKongChoiceWindow.owner];
    if(!choiceOwner||state.phase!=='discarding')state._specialKongChoiceWindow=null;
  }
  const window=state._kongActionWindow;
  if(window&&window.kind==='addedKongChain'){
    const owner=state.players&&state.players[window.owner];
    const initial=window.initialResource,chain=window.chainPongMeld;
    const liveResource=initial&&state._kongResources.find(function(item){return item&&item.owner===window.owner&&item.tile===initial.tile;});
    const hasInitialGang=!!(owner&&Array.isArray(owner.melds)&&initial&&owner.melds.some(function(meld){return meld.count===4&&tkey(meld.tile)===initial.tile&&meld.fromPlayer===initial.pongMeld.fromPlayer;}));
    const hasChainPong=!!(owner&&Array.isArray(owner.melds)&&chain&&owner.melds.some(function(meld){return meld.count===3&&tkey(meld.tile)===chain.tiles[0]&&meld.fromPlayer===chain.fromPlayer;}));
    const hasChainTiles=!!(owner&&Array.isArray(owner.hand)&&chain&&owner.hand.filter(function(tile){return tkey(tile)===chain.tiles[0];}).length===1);
    if(!liveResource||liveResource.status!=='consumed'||!hasInitialGang||!hasChainPong||!hasChainTiles)state._kongActionWindow=null;
  }else if(window){
    const resource=state._kongResources.find(function(item){return item&&item.owner===window.owner&&window.resource&&item.tile===window.resource.tile;});
    const owner=state.players&&state.players[window.owner];
    if(!resource||resource.status!=='consumed'||!owner||!Array.isArray(owner.hand))state._kongActionWindow=null;
  }
  return {applied:true,reason:invalidated?'resource-invalidated':'ok'};
}

function st(k){
  if('DNXBHFW'.includes(k))return {k,t:'honor',s:{D:'dong',N:'nan',X:'xi',B:'bei',H:'zhong',F:'fa',W:'bai'}[k],v:0};
  const m={w:'wan',t:'tong',j:'tiao'};
  return {k,t:'num',s:m[k[0]],v:parseInt(k.slice(1))};
}

function classifyWin(hand){
  return ruleClassification(hand).primaryType;
}

function calcScore(hand,wt){
  const classification=ruleClassification(hand);
  const result=RULE_ENGINE.calculateScore({
    handTypes:classification.handTypes,
    baseScore:classification.baseScore,
    winMethod:ruleWinMethod(wt),
    currentPlayer:0,
    lianGangCount:wt==='杠开'&&((GS._kc[GS.cur]||0)>=2)?1:0
  });
  const pay=Array.isArray(result.scorePerPlayer)?Math.max.apply(null,result.scorePerPlayer):0;
  return pay||Math.max(0,result.winnerGain);
}

// -- game flow --
function completeHumanDraw(playerIdx,reason){
  if(GS.phase!=='drawing'||GS.cur!==playerIdx||!GS.players[playerIdx]||!GS.players[playerIdx].human)return false;
  if(GS.wall.length===0){drawGame();return false;}
  GS.newDrawnTile=GS.wall.pop();
  GS.players[playerIdx].hand.push(GS.newDrawnTile);
  clearPlayerDrawMarker(playerIdx);
  logEvent(playerIdx,'摸牌',GS.newDrawnTile);
  GS.newDrawnIdx=GS.players[playerIdx].hand.length-1;
  clearSelectedTile();
  GS.canWS=canSelfWinForPlayer(playerIdx,GS.newDrawnTile,'自摸');
  GS.canK=!!canSelfKong(playerIdx);
  GS.phase='discarding';
  setMsg('选择要打出的牌（新摸的牌在最右边）');
  render();updateBtns();updateSuggestion();
  saveGameSnapshot(reason||'human-draw');
  return true;
}

function doDraw(){
  if(!GS.players[GS.cur]||!GS.players[GS.cur].human)return;
  completeHumanDraw(GS.cur,'human-draw');
}

function applyPageKongDiscardLifecycle(playerIdx,tile){
  setPageKongResources(transitionPageKongResources(pageKongResources(),{type:'discard',player:playerIdx,tile:tkey(tile)}));
  transitionPageCandidateKongResources({type:'discard',player:playerIdx,tile:tkey(tile)});
  if(GS._specialKongChoiceWindow&&GS._specialKongChoiceWindow.owner===playerIdx)GS._specialKongChoiceWindow=null;

function doDiscard(selectedTile){
  if(GS.phase!=='discarding')return;
  const p=GS.players[GS.cur];

  if(!GS.players[GS.cur].human)return;

  // 摸到的牌已在上游推入手牌，此处无需 push
  // Locate the exact selected object so duplicate tiles stay unambiguous.
  const idx = p.hand.findIndex(function(t){return teq(t,selectedTile);});
  if(idx<0 || idx>=p.hand.length){
    clearSelectedTile();render();updateSuggestion();return;
  }
  const tile = p.hand.splice(idx,1)[0];
  recordRecommendationChoice('discard','打'+lbl(tile));
  // The draw marker only applies before the current discard completes.
  GS.newDrawnTile=null;GS.newDrawnIdx=-1;
  clearPlayerDrawMarker(GS.cur);
  
  GS.discards.push(tile);GS.lastDiscard=tile;GS.lastDiscardP=GS.cur;
  GS.playerDiscards[GS.cur].push(tile);
  applyPageKongDiscardLifecycle(GS.cur,tile);
  clearSelectedTile();GS.canWS=false;GS.canK=false;

  logEvent(GS.cur,'弃牌',tile);
  // RL 奖励：向听数变化
  const oldShanten=getAiHandMeta(p.hand,'rlOldShanten');
  if(window.RL&&RL.useRL&&oldShanten!==undefined){
    const newShanten=calcShanten(p.hand);
    RL.recordShantenChange(GS.cur,oldShanten,newShanten);
    clearAiHandMeta(p.hand,'rlOldShanten');
  }
  checkResponses();
}

function canPongChk(h,t){return RULE_ENGINE.canPeng(ruleTiles(h),tkey(t));}

function canSelfKong(p){
  if(!GS.newDrawnTile) return null;
  const t=GS.newDrawnTile,pl=GS.players[p];
  const addedChainAction=preparePageAddedKongChainAction(p);
  if(addedChainAction)return {type:'addedKongChain',tile:kt(addedChainAction.input.chainPongMeld.tiles[0]),action:addedChainAction};
  const chainAction=preparePageChainKongAction(p);
  if(chainAction)return {type:'chain',tile:kt(chainAction.secondKongTile),action:chainAction};
  const deferredAction=preparePageDeferredKongAction(p);
  if(deferredAction)return {type:'deferred',tile:kt(deferredAction.resource.tile),action:deferredAction};
  // Add-kong: after drawing, any tile already ponged can be upgraded if one copy remains in hand.
  if(pl.melds){
    for(const meld of pl.melds){
      if(meld.count===3&&pl.hand.some(function(tile){return teq(tile,meld.tile);})&&RULE_ENGINE.canMingGang(ruleTiles(pl.hand),ruleMeldsForPlayer(p),tkey(meld.tile))) return {type:'add',tile:meld.tile};
    }
  }
  // 暗杠：手牌（含刚摸的）中是否有 >=4 张同名牌
  const anGangTiles=RULE_ENGINE.canAnGang(ruleTiles(pl.hand));
  if(anGangTiles.includes(tkey(t))) return {type:'concealed',tile:t};
  for(const k of anGangTiles){
    const tile=pl.hand.find(function(item){return tkey(item)===k;});
    if(tile)return {type:'concealed',tile:tile};
  }
  return null;
}

function doPong(p){

    const handAfterKong=removePageTiles(player.hand,tile,1);

    player.hand=nextHand;player.melds=nextMelds;GS.wall=GS.wall.slice(0,-1);GS.newDrawnTile=drawTile;GS.newDrawnIdx=nextHand.length-1;
    GS._kongActionWindow=null;replacePageKongResource(result.resolution.resourceAfterKong);GS._kc[owner]=(GS._kc[owner]||0)+1;
    logEvent(owner,'kong-draw',drawTile,{actionKind:'addedKongChain',outcome:result.resolution.outcome,decompositionSignature:result.resolution.evaluation&&result.resolution.evaluation.decomposition&&result.resolution.evaluation.decomposition.signature});

    if(result.settlement)return completePageKongSettlement(owner,replayAction,result);
    return commitPageSpecialFailureDiscard(owner,action,replayAction,result,drawTile);

  if(action.kind==='doublePongForcedRun'){
    const selected=action.input.selectedResource,conditional=action.input.conditionalResource;let tile;

    if(!handAfterKong||pongIndex<0)return false;
    nextHand=handAfterKong.concat([drawTile]);nextMelds=player.melds.map(function(meld,index){return index===pongIndex?Object.assign({},meld,{count:4}):meld;});
    player.hand=nextHand;player.melds=nextMelds;GS.wall=GS.wall.slice(0,-1);GS.newDrawnTile=drawTile;GS.newDrawnIdx=nextHand.length-1;
    replacePageKongResource(result.resolution.resourceAfterKong.selected);GS._kc[owner]=(GS._kc[owner]||0)+1;
    if(result.settlement)return completePageKongSettlement(owner,replayAction,result);
    return commitPageSpecialFailureDiscard(owner,action,replayAction,result,drawTile);
  }
  return false;
}

  if(!action||!action.resource||!Number.isInteger(action.owner)||!Array.isArray(GS.players))return false;

  if(!player||!Array.isArray(player.hand)||!Array.isArray(player.melds))return false;
  let tile;
  try{tile=kt(action.resource.tile);}catch(error){return false;}
  const handAfterKong=removePageTiles(player.hand,tile,1);
  const pongIndex=player.melds.findIndex(function(meld){return meld.count===3&&teq(meld.tile,tile);});
  if(!handAfterKong||pongIndex<0)return false;
  const preflight=preflightPageKongResolution(action,owner,null);
  if(!preflight||!isPageKongCommitResultValid(action,preflight.result))return false;
  const drawTile=preflight.drawTile,replayAction=preflight.replayAction,result=preflight.result;
  const nextMelds=player.melds.map(function(meld,index){return index===pongIndex?Object.assign({},meld,{count:4}):meld;});
  const nextHand=handAfterKong.concat([drawTile]);
  player.hand=nextHand;player.melds=nextMelds;GS.wall=GS.wall.slice(0,-1);
  GS.newDrawnTile=drawTile;GS.newDrawnIdx=nextHand.length-1;
  replacePageKongResource(result.resolution.resourceAfterKong);
  GS._kc[owner]=(GS._kc[owner]||0)+1;
  logEvent(owner,'杠后摸',drawTile,pageKongResolutionLogMeta(action,result.resolution));
  if(result.settlement){completePageKongSettlement(owner,replayAction,result);return true;}
  resetPageKongResponseState(owner);GS.phase='discarding';GS.canK=!!canSelfKong(owner);
  setMsg(GS.players[owner].name+'延迟强行跑杠未跑到，请出牌');
  render();updateBtns();saveGameSnapshot('deferred-forced-run-failure-discard');
  if(!player.human){clearTimeout(GS._aiActionTimer);GS._aiActionTimer=gameSetTimeout(function(){aiDiscard(owner);},1200);}
  else updateSuggestion();
  return true;
}
function applyPageChainKongAction(action){
  if(!action||!Number.isInteger(action.owner)||!Array.isArray(GS.players))return false;
  const owner=action.owner,player=GS.players[owner];
  if(!player||!Array.isArray(player.hand)||!Array.isArray(player.melds))return false;
  let tile;
  try{tile=kt(action.secondKongTile);}catch(error){return false;}
  const handAfterKong=removePageTiles(player.hand,tile,4);
  if(!handAfterKong)return false;
  const pointKongPlayer=GS._kongActionWindow&&GS._kongActionWindow.pointKongPlayer;
  const preflight=preflightPageKongResolution(action,owner,pointKongPlayer);
  if(!preflight||!isPageKongCommitResultValid(action,preflight.result))return false;
  const drawTile=preflight.drawTile,replayAction=preflight.replayAction,result=preflight.result;
  const nextHand=handAfterKong.concat([drawTile]);
  const nextMelds=player.melds.concat([{tile:tile,count:4,fromPlayer:owner}]);
  player.hand=nextHand;player.melds=nextMelds;GS.wall=GS.wall.slice(0,-1);
  GS.newDrawnTile=drawTile;GS.newDrawnIdx=nextHand.length-1;
  GS._kongActionWindow=null;
  GS._kc[owner]=(GS._kc[owner]||0)+1;
  logEvent(owner,'杠后摸',drawTile,{actionKind:'连杠',outcome:result.resolution.outcome});
  return completePageKongSettlement(owner,replayAction,result);
}
function applyPageNormalConcealedKongAction(p,info){
  if(!info||info.type!=='concealed'||!GS.players[p]||!GS.newDrawnTile||!Array.isArray(GS.wall)||GS.wall.length===0)return false;
  const player=GS.players[p],tile=info.tile||GS.newDrawnTile;
  const handAfterKong=removePageTiles(player.hand,tile,4);
  const drawTile=GS.wall[GS.wall.length-1];
  if(!handAfterKong||!drawTile)return false;
  const key=tkey(tile),melds=ruleMeldsForPlayer(p).concat([{type:'anGang',tiles:[key,key,key,key]}]);
  const action={owner:p,kongTile:key,preKongHand:ruleTiles(player.hand),handAfterKong:ruleTiles(handAfterKong),melds:melds,drawTile:tkey(drawTile)};
  let resolution,settlement;
  try{
    resolution=RULE_ENGINE.resolveConcealedKongDraw(action);
    settlement=RULE_ENGINE.scoreConcealedKongSettlement({action:action,winner:p,scores:GS.players.map(function(item){return item.score;})});
  }catch(error){return false;}
  if(!resolution||resolution.mustDiscard||resolution.robKongWindow||!settlement||!Array.isArray(settlement.after)||settlement.after.length!==GS.players.length)return false;
  const nextHand=handAfterKong.concat([drawTile]);
