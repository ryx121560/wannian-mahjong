  logEvent(p,'杠后摸',drawTile,{actionKind:'普通暗杠',outcome:resolution.outcome,robKongWindow:false});
  return completePageKongSettlement(p,{kind:'concealedKong'},{resolution:{outcome:resolution.outcome,evaluation:{decomposition:resolution.classification.selectedDecomposition}},settlement:settlement});
}

function doSelfKong(p){
  clearSelectedTile();
  const specialChoices=collectPageSpecialKongChoices(p);
  if(specialChoices.length===1)return executePageSpecialKongAction(specialChoices[0].action);
  if(specialChoices.length>1){
    if(openPageSpecialKongChoiceWindow(p,specialChoices)){
      renderPageSpecialKongChoiceMenu(p,specialChoices);render();updateBtns();saveGameSnapshot('special-kong-choice-window');
      return true;
    }
    return false;
  }
  const addedChainAction=preparePageAddedKongChainAction(p);
  if(addedChainAction){
    const chainTile=addedChainAction.input.chainPongMeld.tiles[0];
    const robWinner=resolvePageRobKongWinner(p,chainTile);
    if(robWinner!=null){setMsg(GS.players[robWinner].name+'抢杠胡牌！');GS._robKongTarget=p;applyWin(robWinner,'抢杠');return true;}
    return applyPageAddedKongChainAction(addedChainAction);
  }
  const chainAction=preparePageChainKongAction(p);
  if(chainAction){
    const robWinner=RULE_ENGINE.resolveRobKongWinner(pageRuleState(GS),p,chainAction.secondKongTile);
    if(robWinner!=null){setMsg(GS.players[robWinner].name+'抢杠胡牌！');GS._robKongTarget=p;applyWin(robWinner,'抢杠');return true;}
    return applyPageChainKongAction(chainAction);
  }
  const deferredAction=preparePageDeferredKongAction(p);
  if(deferredAction){
    const robWinner=RULE_ENGINE.resolveRobKongWinner(pageRuleState(GS),p,deferredAction.resource.tile);
    if(robWinner!=null){setMsg(GS.players[robWinner].name+'抢杠胡牌！');GS._robKongTarget=p;applyWin(robWinner,'抢杠');return true;}
    return applyPageDeferredKongAction(deferredAction);
  }
  const info=canSelfKong(p);
  if(!info||!GS.newDrawnTile) return;
  if(info.type==='add'){
    const result=resolvePageAddedKongDraw(p,info);
    if(!result)return false;
    if(result.outcome==='addedKongRobbed'){
      setMsg(GS.players[result.robKongWinner].name+'抢杠胡牌！');GS._robKongTarget=p;applyWin(result.robKongWinner,'抢杠');return true;
    }
    return applyPageAddedKongDraw(p,result);
  }
  if(info.type==='concealed')return applyPageNormalConcealedKongAction(p,info);
  return false;
}

// -- settle --
function applyWin(winner,wt){
  if(GS._respTimer){clearTimeout(GS._respTimer);GS._respTimer=null;}
  clearSelectedTile();
  const winAudit=auditFinalWinBeforeSettlement(winner,wt);
  if(!winAudit.ok){
    GS.phase='ended';GS.canP=GS.canK=GS.canW=GS.canWS=false;GS._resp=null;GS._respP=-1;GS._responseKind=null;
    invalidatePageKongResources();
    finalizeRecommendationSummary();
    if(_selfPlay.running){
      _selfPlay.running=false;configureAiLearning(false);
      document.getElementById('bt-selfplay').textContent='自弈';
      setSelfPlayUiState();
      document.getElementById('sp-info').textContent='自弈停止：胡牌最终复核失败';
    }
    setMsg('胡牌最终复核失败，已阻止结算');
    render();updateBtns();
    saveGameSnapshot('invalid-win-blocked');
    return;
  }
  GS.phase='ended';GS.canP=GS.canK=GS.canW=GS.canWS=false;GS._resp=null;GS._respP=-1;GS._responseKind=null;GS.newDrawnTile=null;GS.newDrawnIdx=-1;
  invalidatePageKongResources();
  clearAllDrawMarkers();
  document.getElementById('suggest').style.display='block';
  GS._preWinScores=GS.players.map(function(p){return p.score;});
  const eh=effectiveHand(winner);
  const pts=calcScore(eh,wt);
  const payer=(wt==='抢杠'&&Number.isInteger(GS._robKongTarget)&&GS._robKongTarget>=0)?GS._robKongTarget:GS.lastDiscardP;
  if(wt==='点炮'||wt==='抢杠'){
    GS.players[winner].score+=pts;
    GS.players[payer].score-=pts;
  }else{
    GS.players[winner].score+=pts*3;
    for(let i=0;i<4;i++)if(i!==winner)GS.players[i].score-=pts;
  }
  const settlementScoreDeltas=captureSettlementScoreDeltas(GS._preWinScores,GS.players);
  logEvent(winner,'胡牌['+wt+']',null);
  finalizeRecommendationSummary();
  saveGameLog({winner:winner,winnerName:GS.players[winner].name,type:wt,
    hand:effectiveHand(winner).map(t=>tkey(t)).join(','),
    huType:classifyWin(eh),pts:pts,
    scores:GS.players.map(p=>({name:p.name,score:p.score}))});
  renderFinalRecommendationPanel();
  // RL 学习
  if(window.RL&&RL.useRL){
    RL.endGame(winner);
    if(wt==='点炮'||wt==='抢杠'){
      RL.recordWin(winner,false);
      RL.recordDealIn(payer);
    }else{
      RL.recordWin(winner,true);
    }
  }
  totalGamesPlayed++;
  const bankrupt=persistSettledScores();
  // 随对局增加MCTS模拟次数（从100逐渐提升到300）
  if(window.MCTS){
    MCTS.sims = Math.min(300, 100 + Math.floor(totalGamesPlayed / 5) * 10);
  }
  // 每局结束保存RL权重
  window.RL&&RL.saveAll();
  const resultTitle=GS.players[winner].name+'胡了！';
  GS._lastResult={title:bankrupt>=0?resultTitle+' 积分已重置':resultTitle,type:wt,huType:classifyWin(eh),pts:pts,winner:winner,bankrupt:bankrupt,scoreDeltas:settlementScoreDeltas,displayText:formatWinSettlementText(bankrupt>=0?resultTitle+' 积分已重置':resultTitle,classifyWin(eh)+'('+wt+')',pts)};commitTopSettlementSummary(GS._lastResult);
  saveGameSnapshot(bankrupt>=0?'bankruptcy-reset':'win-settled');
  _spOnGameEnd(winner);
  setMsg(GS._lastResult.displayText);
  if(_selfPlay.running){const _info=GS.players[winner].name+'胡了!'+classifyWin(eh)+'('+wt+')';document.getElementById('sp-info').textContent=_info;gameSetTimeout(function(){startSelfPlayGame();},10);return;}
  render();
  const h=classifyWin(eh);
  showWinDlg(`${GS.players[winner].name}胡了！`,`${h}(${wt})`,pts);
}

function showWinDlg(title,type,pts){
  setMsg(formatWinSettlementText(title,type,pts));
}

function formatWinSettlementText(title,type,pts){
  const hasPreScores=Array.isArray(GS._preWinScores)&&GS._preWinScores.length===GS.players.length;
  const scores=GS.players.map(function(p,i){
    if(!hasPreScores)return p.name+':'+p.score;
    var d=p.score-GS._preWinScores[i];
    var sign=d>=0?'+':'';
    return p.name+':'+sign+d+'('+p.score+')';
  }).join(' | ');
  const displayPts=hasPreScores?Math.max.apply(null,GS.players.map(function(p,i){return p.score-GS._preWinScores[i];})):pts;
  return `${title}  ${type}  ${displayPts>0?'+'+displayPts:displayPts}分  ${scores}`;
}

function selfPlayAudit(){
  if(!_selfPlay.audit)_selfPlay.audit={invalidWins:0,suspiciousWins:0,failures:[]};
  return _selfPlay.audit;
}
function winAuditSnapshot(winner,wt,winTile,ruleResult){
  const auditLog=GS._gameLog||null;
  const auditHand=auditWinHand(winner,wt,winTile);
  return {
    gameId:auditLog&&auditLog.gameId,
    turn:GS.turn,
    winner:winner,
    hand:auditHand.map(tkey),
    concealedHand:concealedHand(winner).map(tkey),
    melds:ruleMeldsForPlayer(winner),
    winTile:winTile?tkey(winTile):null,
    winType:wt,
    lastDiscardPlayer:GS.lastDiscardP,
    ruleResult:ruleResult,
    lastEvents:auditLog&&Array.isArray(auditLog.events)?auditLog.events.slice(-10):[],
    stateSnapshot:{phase:GS.phase,cur:GS.cur,wall:GS.wall.length,scores:GS.players.map(function(p){return p.score;})}
  };
}
function auditWinHand(winner,wt,winTile){
  const hand=concealedHand(winner);
  if((wt==='点炮'||wt==='抢杠')&&winTile)return hand.concat([winTile]);
  return hand;
}
function auditFinalWinBeforeSettlement(winner,wt){
  const hand=concealedHand(winner);
  const ruleMelds=ruleMeldsForPlayer(winner);
  const winTile=(wt==='点炮'||wt==='抢杠')?GS.lastDiscard:(GS.newDrawnTile||hand[hand.length-1]||null);
  const auditHand=auditWinHand(winner,wt,winTile);
  const ruleContext={melds:ruleMelds,winTile:winTile?tkey(winTile):undefined,winType:ruleWinMethod(wt)};
  const ruleResult=RULE_ENGINE.canWin(ruleTiles(auditHand),ruleContext);
  const audit=selfPlayAudit();
  const auditLog=GS._gameLog||null;
  if(!ruleResult||!ruleResult.canWin){
    audit.invalidWins++;
    const failure=winAuditSnapshot(winner,wt,winTile,ruleResult);
    audit.failures.push(Object.assign({type:'invalidWin',message:'Game declared win, but rule engine canWin=false'},failure));
    console.error('[win-audit] invalid win blocked',failure);
    if(auditLog){
      auditLog.invalidWins=(auditLog.invalidWins||0)+1;
      auditLog.winAuditFailure=failure;
    }
    return {ok:false,ruleResult:ruleResult,winTile:winTile};
  }
  const tileCount=auditHand.length+ruleMelds.length*3;
  const missingPointContext=(wt==='点炮'||wt==='抢杠')&&(!GS.lastDiscard||GS.lastDiscardP<0);
  if(tileCount!==14||!winTile||missingPointContext){
    audit.suspiciousWins++;
    const warning=winAuditSnapshot(winner,wt,winTile,ruleResult);
    audit.failures.push(Object.assign({type:'suspiciousWin',message:'Rule engine accepted win, but win context is incomplete or abnormal'},warning));
    console.warn('[win-audit] suspicious win context',warning);
    if(auditLog)auditLog.suspiciousWins=(auditLog.suspiciousWins||0)+1;
  }
  return {ok:true,ruleResult:ruleResult,winTile:winTile};
}

// -- AI --
async function aiTurn(p){
  if(GS.phase!=='drawing')return;
  if(GS.wall.length===0){drawGame();return;}
  // 手牌不变式守卫：摸牌前检查手牌是否异常膨胀
  const hl=GS.players[p].hand.length;
  const meldCount=(GS.players[p].melds||[]).reduce((s,m)=>s+(m.count||0),0);
  if(hl>13-meldCount){console.warn('[aiTurn] p'+p+' 摸牌前手牌异常 hand='+hl+' melds='+meldCount);}
  const dt=GS.wall.pop();
  GS.newDrawnTile=dt;GS.newDrawnIdx=GS.players[p].hand.length;
  GS.players[p].hand.push(dt);
  markPlayerDrawnTile(p,dt);
  logEvent(p,'摸牌',dt);
  GS.phase='discarding';
  saveGameSnapshot('ai-draw');
  if(canSelfWinForPlayer(p,dt,'自摸')){
    logAiResponseDecision(p,'selfDrawWin',dt,aiBestShantenForPlayer(GS.players[p].hand,p),-1,'摸牌后已满足胡牌条件，自摸优先于开杠');
    render();clearTimeout(GS._aiActionTimer);GS._aiActionTimer=gameSetTimeout(()=>applyWin(p,'自摸'),500);return;
  }
  // 检查自杠（加杠/暗杠）机会
  const kongInfo=canSelfKong(p);
  if(kongInfo){render();clearTimeout(GS._aiActionTimer);GS._aiActionTimer=gameSetTimeout(()=>aiSelfKong(p,kongInfo),800);return;}
  render();clearTimeout(GS._aiActionTimer);GS._aiActionTimer=gameSetTimeout(()=>{if(GS.players[p]&&!GS.players[p].human)aiDiscard(p);},1200);
}

function removeTilesForSelfKong(hand,tile,count){
  const h=[...hand];
  let removed=0;
  for(let i=h.length-1;i>=0&&removed<count;i--){
    if(teq(h[i],tile)){h.splice(i,1);removed++;}
  }
  return h;
}

function evaluateAiSelfKong(p,kongInfo){
  const t=GS.newDrawnTile;
  const hand=GS.players[p].hand;
  const preDrawHand=removeTilesForSelfKong(hand,t,1);
  const before=aiBestShantenForPlayer(preDrawHand,p);
  const removedCount=kongInfo.type==='add'?1:4;
  const afterHand=removeTilesForSelfKong(hand,t,removedCount);
  const extraMeld=kongInfo.type==='concealed'?{tile:t,count:4}:null;
  const afterRoute=aiRouteSummaryForPlayer(afterHand,p,extraMeld);
  const after=afterRoute.v;
  const rawAfter=calcShanten(afterHand);
  const waitBefore=listWaitsWithMelds(preDrawHand,p,ruleMeldsForPlayer(p),tkey(t));
  const waitAfter=listWaitsWithMelds(afterHand,p,ruleMeldsWithExtra(p,extraMeld),tkey(t));
  const waitShape=AI_RULE_CORE.compareWaitShape(waitBefore,waitAfter);
  const lostWaits=waitShape.lostWaits;
  const waitShapePreserved=waitShape.preserved;
  const allow=after<=before&&waitShapePreserved;
  let reason='自杠后综合向听不恶化，且未处于听牌状态，允许开杠';
  if(waitBefore.length>0&&waitShapePreserved)reason='自杠后综合向听不恶化且完整保留听牌形，允许开杠';
  if(after>before)reason='自杠会恶化综合向听，跳过开杠';
  else if(!waitShapePreserved)reason='自杠会丢失原有待牌，跳过开杠';
  return {
    allow:allow,
    beforeShanten:before,
    afterShanten:after,
    rawAfterShanten:rawAfter,
    routeAfter:afterRoute.p,
    waitBefore:waitBefore,
    waitAfter:waitAfter,
    lostWaits:lostWaits,
    reason:reason
  };
}

// AI self-kong with shanten guard.
function aiSelfKong(p,kongInfo){
  if(kongInfo&&((kongInfo.type==='addedKongChain')||(kongInfo.type==='chain')||(kongInfo.type==='deferred'))){
    const actionKind=kongInfo.type==='addedKongChain'?'addedKongChain':(kongInfo.type==='chain'?'chainKong':'forcedRunDeferred');
    logAiResponseDecision(p,'selfKong',kongInfo.tile,0,0,'已按统一规则状态机执行'+pageKongActionLabel(actionKind));
    return doSelfKong(p);
  }
  const t=GS.newDrawnTile,pl=GS.players[p];
  const evalInfo=evaluateAiSelfKong(p,kongInfo);
  const evalCandidate={action:evalInfo.allow?'selfKong':'skipSelfKong',shantenAfter:evalInfo.afterShanten,rawAfterShanten:evalInfo.rawAfterShanten,routeAfter:evalInfo.routeAfter,type:kongInfo.type,waitBefore:evalInfo.waitBefore,waitAfter:evalInfo.waitAfter,lostWaits:evalInfo.lostWaits};
  if(!evalInfo.allow){
    logAiResponseDecision(p,'skipSelfKong',t,evalInfo.beforeShanten,evalInfo.afterShanten,evalInfo.reason,{candidates:[evalCandidate]});
    render();updateBtns();
    saveGameSnapshot('ai-skip-self-kong');
    clearTimeout(GS._aiActionTimer);GS._aiActionTimer=gameSetTimeout(()=>{if(GS.players[p]&&!GS.players[p].human)aiDiscard(p);},600);
    return;
  }
  logAiResponseDecision(p,'selfKong',t,evalInfo.beforeShanten,evalInfo.afterShanten,evalInfo.reason,{candidates:[evalCandidate]});
  if(kongInfo.type==='add'){
    for(let m of pl.melds){if(m.count===3&&teq(m.tile,t)){m.count=4;break;}}
    for(let i=pl.hand.length-1;i>=0;i--){if(teq(pl.hand[i],t)){pl.hand.splice(i,1);break;}}
  }else{
    let rm=0;
    for(let i=pl.hand.length-1;i>=0&&rm<4;i--){if(teq(pl.hand[i],t)){pl.hand.splice(i,1);rm++;}}
    if(!pl.melds) pl.melds=[];
    pl.melds.push({tile:t,count:4});
  }
  GS.newDrawnTile=null;GS.newDrawnIdx=-1;
  clearPlayerDrawMarker(p);
  logEvent(p,kongInfo.type==='add'?'加杠':'暗杠',t);
  if(GS.wall.length>0){const dt=GS.wall.pop();pl.hand.push(dt);GS._kc[p]=(GS._kc[p]||0)+1;logEvent(p,'杠后摸',dt);if(!pl.human)markPlayerDrawnTile(p,dt);}
  const _winTileK=GS.players[p].hand[GS.players[p].hand.length-1];
  const wr=canHuNormal(concealedHand(p),false,ruleMeldsForPlayer(p),_winTileK,'杠开');
  if(wr&&wr.win&&_winTileK&&meetsThresh(concealedHand(p),_winTileK,'杠开')){GS.phase='ended';applyWin(p,'杠开');return;}
  GS.phase='discarding';GS.canP=GS.canK=GS.canW=false;
  GS.canWS=canSelfWinForPlayer(p,_winTileK,'杠开');
  setMsg(`${pl.name}开杠${lbl(t)}，请出牌`);
  render();updateBtns();
  saveGameSnapshot(kongInfo.type==='add'?'ai-add-kong':'ai-concealed-kong');
  clearTimeout(GS._aiActionTimer);GS._aiActionTimer=gameSetTimeout(()=>{if(GS.players[p]&&!GS.players[p].human)aiDiscard(p);},1200);
}

async function aiDiscard(p){
  if(GS.phase!=='discarding')return;
  // 自弈停止后禁止AI操作人类玩家手牌
  if(GS.players[p] && GS.players[p].human) return;
  if(canSelfWinForPlayer(p,GS.newDrawnTile,'自摸')&&GS.newDrawnTile){applyWin(p,'自摸');return;}
  const h=GS.players[p].hand,idx=await aiChooseDiscard(h,p);
  const t=h[idx];
  const decisionLog=getAiHandMeta(h,'aiDecisionLog')||buildAiDecisionLog(h,p,idx,'fallback','未命中详细决策记录，使用最终弃牌兜底');
  clearAiHandMeta(h,'aiDecisionLog');
  // 记录 AI 推荐路线日志
  const subLog=h.filter(function(_,j){return j!==idx;});
  const routeValues=aiRouteValuesForPlayer(subLog,p);
  const sN=routeValues.norm,s7=routeValues['7p'],sD=routeValues.dalan,sZ=routeValues.quanzheng,sBZ=routeValues.banzheng;
  const sAll=[{p:'norm',v:sN},{p:'7p',v:s7},{p:'dalan',v:sD},{p:'quanzheng',v:sZ},{p:'banzheng',v:sBZ}];
  sAll.sort(compareAiRoutes);
  logSuggestion(h,p,sAll[0].v,sAll[0].p,t,subLog,decisionLog);
  // 在排序后手牌中的位置（render 里用的是排序数组）
  const sIdx=aiDisplayHand(p).indexOf(t);
  // 第一阶段：牌抬起展示
  GS._aiDiscardAnim={p:p,idx:sIdx};render();
  // 第二阶段：完成弃牌
  clearTimeout(GS._aiAnimTimer);
  GS._aiAnimTimer=gameSetTimeout(()=>{
    // 自弈停止后不修改人类手牌
    if(GS.players[p] && GS.players[p].human){
      GS._aiDiscardAnim=null;render();return;
    }
    const aiDecisionLog=getAiHandMeta(h,'aiDecisionLog');
    h.splice(idx,1);
    GS.discards.push(t);GS.lastDiscard=t;GS.lastDiscardP=p;
    GS.playerDiscards[p].push(t);
    applyPageKongDiscardLifecycle(p,t);
    GS.newDrawnTile=null;GS.newDrawnIdx=-1;
    clearPlayerDrawMarker(p);
    GS._aiDiscardAnim=null;
  _spOnDiscard(p,t);
    logEvent(p,'弃牌',t);
    if(GS._recommendation){
      GS._recommendation.lastAiInterpretation={player:p,playerName:GS.players[p]?GS.players[p].name:'AI',tile:tkey(t),tileLabel:lbl(t),mctsSummary:aiDecisionLog&&aiDecisionLog.mctsSummary?aiDecisionLog.mctsSummary:null};
      recordAiDiscardInterpretation(p,t);
    }
    // RL 奖励：向听数变化
    const oldShanten=getAiHandMeta(h,'rlOldShanten');
    if(window.RL&&RL.useRL&&oldShanten!==undefined){
      const newShanten=aiBestShantenForPlayer(h,p);
      RL.recordShantenChange(p,oldShanten,newShanten);
      clearAiHandMeta(h,'rlOldShanten');
    }
    setMsg(`${GS.players[p].name}打出了${lbl(t)}`);
    render();checkResponses();
  },800);
}

function calcShanten(hand){
  return ruleShantenResult(hand).normal;
  // 数牌统计
  const wan=Array(9).fill(0),tong=Array(9).fill(0),tiao=Array(9).fill(0);
  const winds=[0,0,0,0],dragons=[0,0,0]; // dong/nan/xi/bei  zhong/fa/bai
  for(const t of hand){
    if(t.t==='num'){
      if(t.s==='wan')wan[t.v-1]++;else if(t.s==='tong')tong[t.v-1]++;else tiao[t.v-1]++;
    }else{
      const wi={dong:0,nan:1,xi:2,bei:3}[t.s],di={zhong:0,fa:1,bai:2}[t.s];
      if(wi!==undefined)winds[wi]++;else if(di!==undefined)dragons[di]++;
    }
  }
  // 递归分解数牌：返回 [melds, taatsu, hasPair]
  function decNum(cnt,pos,hp,depth){
    if(depth===undefined)depth=0;
    if(depth>120){console.warn('[calcShanten] decNum depth fallback',{pos:pos,depth:depth,counts:cnt.slice()});let m=0,t=0;for(let k=pos;k<9;k++)if(cnt[k]>0){m+=Math.floor(cnt[k]/3);cnt[k]%=3;if(cnt[k]>=2)t++;else if(cnt[k]===1&&k+1<9&&cnt[k+1]>0){t++;cnt[k+1]--;}}return[m,t,hp||t>0];}
    while(pos<9&&cnt[pos]===0)pos++;
    if(pos>=9)return[0,0,hp];
    let best=[0,0,false];const score=r=>2*r[0]+r[1]+(r[2]?1:0);
    const r0=decNum(cnt,pos+1,hp,depth+1);if(score(r0)>score(best)||(score(r0)===score(best)&&r0[0]>best[0]))best=r0;
    if(cnt[pos]>=3){cnt[pos]-=3;const r=decNum(cnt,pos,hp,depth+1);if(score([r[0]+1,r[1],r[2]])>score(best)||(score([r[0]+1,r[1],r[2]])===score(best)&&r[0]+1>best[0]))best=[r[0]+1,r[1],r[2]];cnt[pos]+=3;}
    if(pos<=6&&cnt[pos]>=1&&cnt[pos+1]>=1&&cnt[pos+2]>=1){
      cnt[pos]--;cnt[pos+1]--;cnt[pos+2]--;const r=decNum(cnt,pos,hp,depth+1);
      if(score([r[0]+1,r[1],r[2]])>score(best))best=[r[0]+1,r[1],r[2]];cnt[pos]++;cnt[pos+1]++;cnt[pos+2]++;
    }
    if(!hp&&cnt[pos]>=2){cnt[pos]-=2;const r=decNum(cnt,pos,true,depth+1);if(score(r)>score(best)||(score(r)===score(best)&&r[0]>best[0]))best=r;cnt[pos]+=2;}
    if(pos<=7&&cnt[pos]>=1&&cnt[pos+1]>=1){
      cnt[pos]--;cnt[pos+1]--;const r=decNum(cnt,pos,hp,depth+1);
      if(score([r[0],r[1]+1,r[2]])>score(best))best=[r[0],r[1]+1,r[2]];cnt[pos]++;cnt[pos+1]++;
    }
    if(pos<=6&&cnt[pos]>=1&&cnt[pos+2]>=1){
      cnt[pos]--;cnt[pos+2]--;const r=decNum(cnt,pos,hp,depth+1);
      if(score([r[0],r[1]+1,r[2]])>score(best))best=[r[0],r[1]+1,r[2]];cnt[pos]++;cnt[pos+2]++;
    }
    return best;
  }
  // 字牌分解：cnt 数组，n 种类数，canSeq(pos,cnt)→[[j,k],...]；返回 [melds, taatsu, hasPair]（字牌无搭子，taatsu 恒为 0）
  function decHonor(cnt,n,hp,canSeq){
    function dfs(pos,hp2,depth){
      if(depth===undefined)depth=0;
      if(depth>120){console.warn('[calcShanten] decHonor depth fallback',{pos:pos,depth:depth,counts:cnt.slice()});let m=0;for(let k=pos;k<n;k++)if(cnt[k]>=3){m+=Math.floor(cnt[k]/3);cnt[k]%=3;}return[m,0,hp2||cnt.some(c=>c>=2)];}
      while(pos<n&&cnt[pos]===0)pos++;
      if(pos>=n)return[0,0,hp2];
      let best=[0,0,false];const score=r=>2*r[0]+(r[2]?1:0);
      const r0=dfs(pos+1,hp2,depth+1);if(score(r0)>score(best)||(score(r0)===score(best)&&r0[0]>best[0]))best=r0;
      if(cnt[pos]>=3){cnt[pos]-=3;const r=dfs(pos,hp2,depth+1);if(score([r[0]+1,0,r[2]])>score(best)||(score([r[0]+1,0,r[2]])===score(best)&&r[0]+1>best[0]))best=[r[0]+1,0,r[2]];cnt[pos]+=3;}
      if(!hp2&&cnt[pos]>=2){cnt[pos]-=2;const r=dfs(pos,true,depth+1);if(score(r)>score(best)||(score(r)===score(best)&&r[0]>best[0]))best=r;cnt[pos]+=2;}
      if(canSeq){for(const[j,k]of canSeq(pos,cnt)){cnt[pos]--;cnt[j]--;cnt[k]--;const r=dfs(pos,hp2,depth+1);if(score([r[0]+1,0,r[2]])>score(best)||(score([r[0]+1,0,r[2]])===score(best)&&r[0]+1>best[0]))best=[r[0]+1,0,r[2]];cnt[pos]++;cnt[j]++;cnt[k]++;}}
      return best;
    }
    return dfs(0,hp,0);
  }
  // 万年麻将：任意三张不同风牌=顺子
  const wr=decHonor(winds,4,false,(pos,cnt)=>{const r=[];for(let j=pos+1;j<4;j++){if(!cnt[j])continue;for(let k=j+1;k<4;k++){if(cnt[k])r.push([j,k]);}}return r;});
  const dr=decHonor(dragons,3,false,(pos,cnt)=>(pos===0&&cnt[0]&&cnt[1]&&cnt[2])?[[1,2]]:[]);
  // 万年麻将：三元牌（中发白）任意两张形成搭子（等第三张即成刻子）
  if(wr[0]===0&&!wr[2]){const p=winds.filter(c=>c>0);if(p.length===2&&p.every(c=>c===1))wr[1]=1;}
  if(dr[0]===0&&!dr[2]){const p=dragons.filter(c=>c>0);if(p.length===2&&p.every(c=>c===1))dr[1]=1;}
  const wr2=decNum(wan,0,false),tr=decNum(tong,0,false),tir=decNum(tiao,0,false);
  const parts=[wr,dr,wr2,tr,tir];
  // 最多一个雀头：枚举哪个部件出雀头；搭子总数不超过 4-完成面子数
  let bestScore=0;
  for(let i=0;i<parts.length;i++){
    let melds=0,taatsu=0;
    for(let j=0;j<parts.length;j++){melds+=parts[j][0];taatsu+=parts[j][1];}
    taatsu=Math.min(taatsu,4-melds);
    let total=2*melds+taatsu+(parts[i][2]?1:0);
    if(total>bestScore)bestScore=total;
  }
  return Math.max(0,8-bestScore);
}

// 七对子向听数
function calcShanten7Pairs(hand){
  return ruleShantenResult(hand).sevenPairs;
  const cnt={};
  for(const t of hand){const k=t.k;cnt[k]=(cnt[k]||0)+1;}
  let pairs=0;
  for(const v of Object.values(cnt)){pairs+=Math.floor(v/2);}
  return Math.max(0,6-pairs);
}

// 打烂向听数：需要14张不重复、≥5字牌、同色数牌间隔≥3
function calcShantenDalan(hand){
  return ruleShantenResult(hand).dalan;
  const uniq=new Set(hand.map(t=>t.k));
  let issues=hand.length-uniq.size; // 重复牌=问题
  
  const honors=new Set();const bySuit={wan:[],tong:[],tiao:[]};
  for(const t of hand){
    if(t.t==='honor')honors.add(t.k);
    else bySuit[t.s].push(t.v);
  }
  issues+=Math.max(0,5-honors.size); // 字牌不足
  
  for(const vals of Object.values(bySuit)){
    vals.sort((a,b)=>a-b);
    for(let i=1;i<vals.length;i++)if(vals[i]-vals[i-1]<3)issues++;
  }
  return issues;
}

// 全正宗向听数：打烂基础上数牌必须在{1,4,7,2,5,8,3,6,9}内且同组（147/258/369）
function calcShantenZhengzong(hand){
  return ruleShantenResult(hand).quanzhengzong;
  const validNums=new Set([1,4,7,2,5,8,3,6,9]);
  let issues=calcShantenDalan(hand);
  
  for(const t of hand){
    if(t.t==='num'&&!validNums.has(t.v))issues++;
  }
  
  // 全正宗要求同组（147/258/369）
  const grp={g147:0,g258:0,g369:0};
  for(const t of hand){
    if(t.t==='num'&&validNums.has(t.v)){
      const g=t.v%3;if(g===1)grp.g147++;else if(g===2)grp.g258++;else grp.g369++;
    }
  }
  const totalValid=grp.g147+grp.g258+grp.g369;
  const maxGrp=Math.max(grp.g147,grp.g258,grp.g369);
  issues+=Math.max(0,totalValid-maxGrp); // 非同组牌
  return issues;
}

// Semi-authentic route: each suit uses one 147/258/369 group; suits may differ.
function calcShantenBanzhengzong(hand){
  return ruleShantenResult(hand).banzhengzong;
  let issues=calcShantenDalan(hand);
  const suitGroups={wan:[0,0,0],tong:[0,0,0],tiao:[0,0,0]};
  for(const t of hand){
    if(t.t==='num')suitGroups[t.s][t.v%3]++;
  }
  for(const counts of Object.values(suitGroups)){
    const total=counts[0]+counts[1]+counts[2];
    issues+=total-Math.max(counts[0],counts[1],counts[2]);
  }
  return issues;
}

// 打烂/正宗路径的弃牌质量：返回正向分（越高越该弃）
// tile=要弃的牌, sub=弃后剩余手牌
function dalanDiscardScore(tile,sub){
  let sc=0;
  // 重复牌→优先弃（sub中保留数+弃牌本身=原始总数）
  const keepCnt=sub.filter(h=>teq(h,tile)).length;
  if(keepCnt>=1)sc+=5; // 至少有1张保留→重复牌
  // 字牌→保留（不弃），数牌→加分
  if(tile.t==='num')sc+=2;
  // 同色间距违规→加分（sub中检查）
  if(tile.t==='num'){
    const vals=sub.filter(h=>h.t==='num'&&h.s===tile.s).map(h=>h.v);
    vals.sort((a,b)=>a-b);
    if(vals.length>=2)for(let i=1;i<vals.length;i++)if(vals[i]-vals[i-1]<3)sc+=1;
  }
  return sc;
}

// 正宗路径额外弃牌加分：非有效组牌优先弃
function zhengzongDiscardBonus(tile,sub){
  const validNums=new Set([1,4,7,2,5,8,3,6,9]);
  let sc=0;
  if(tile.t==='num'&&!validNums.has(tile.v))sc+=4;
  // 非主导组加分
  const grp={g147:0,g258:0,g369:0};
  for(const t of sub){
    if(t.t==='num'&&validNums.has(t.v)){
      if(t.v%3===1)grp.g147++;else if(t.v%3===2)grp.g258++;else grp.g369++;
    }
  }
  const maxGrp=Math.max(grp.g147,grp.g258,grp.g369);
  if(tile.t==='num'&&validNums.has(tile.v)){
    const g=tile.v%3===1?'g147':tile.v%3===2?'g258':'g369';
    if(grp[g]<maxGrp)sc+=3;
  }
  return sc;
}

// 染手评估：返回主色和数量（混一色含字牌）
function suitBias(hand){
  const cnt={wan:0,tong:0,tiao:0};let honorCnt=0;
  for(const t of hand){
    if(t.t==='honor')honorCnt++;
    else if(t.t==='num')cnt[t.s]++;
  }
  const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const topSuit=e[0][0],topNum=e[0][1];
  const mixed=topNum+honorCnt;
  // 清：主色≥10数牌；混：主色+字牌≥10且主色≥5；半清：主色≥8
  if(topNum>=10)return {suit:topSuit,count:topNum,type:'clear'};
  if(mixed>=10&&topNum>=5)return {suit:topSuit,count:mixed,type:'mixed'};
  if(topNum>=8)return {suit:topSuit,count:topNum,type:'semi-clear'};
  // 准混一色：主色+字牌≥7且<10，主色≥4，有混一色倾向但未达标
  if(mixed>=7&&mixed<10&&topNum>=4)return {suit:topSuit,count:mixed,type:'mixed-lean'};
  return {suit:topSuit,count:topNum,type:'none'};
}

function mixedStrongRoute(hand){
  const cnt={wan:0,tong:0,tiao:0};let honorCnt=0;
  const winds=new Set(),dragons=new Set();
  for(const t of hand){
    if(t.t==='honor'){
      honorCnt++;
      if(['dong','nan','xi','bei'].includes(t.s))winds.add(t.s);
      if(['zhong','fa','bai'].includes(t.s))dragons.add(t.s);
    }else if(t.t==='num')cnt[t.s]++;
  }
  const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const topSuit=e[0][0],topNum=e[0][1];
  const offSuit=hand.filter(function(t){return t.t==='num'&&t.s!==topSuit;}).length;
  const strong=topNum>=6&&honorCnt>=4&&topNum+honorCnt>=10&&offSuit<=3;
  return {type:strong?'mixed-strong':null,suit:topSuit,mainSuitCount:topNum,honorCount:honorCnt,offSuitNumberCount:offSuit,windCombo:winds.size>=2,dragonCombo:dragons.size>=2};
}

function mixedStrongDiscardInfo(hand,tile){
  const route=mixedStrongRoute(hand);
  if(route.type!=='mixed-strong'||!tile)return {type:null,reason:null,adjustment:0};
  if(tile.t==='num'&&tile.s!==route.suit){
    const hasBuddy=hand.some(function(h){return h!==tile&&h.t==='num'&&h.s===tile.s&&Math.abs(h.v-tile.v)<=2;});
    return {type:route.type,reason:'off-suit-number-first',adjustment:hasBuddy?0.95:0.65};
  }
  if(tile.t==='num'&&tile.s===route.suit)return {type:route.type,reason:'protect-main-suit',adjustment:-0.45};
  if(tile.t==='honor'&&['dong','nan','xi','bei'].includes(tile.s)&&route.windCombo)return {type:route.type,reason:'protect-wind-combo',adjustment:-1.25};
  if(tile.t==='honor'&&['zhong','fa','bai'].includes(tile.s)&&route.dragonCombo)return {type:route.type,reason:'protect-dragon-combo',adjustment:-1.25};
  if(tile.t==='honor')return {type:route.type,reason:'protect-honor-route',adjustment:-0.45};
  return {type:route.type,reason:null,adjustment:0};
}

// 对手手牌推理：从弃牌反推对手可能持有的花色
function oppSuitDanger(oppIdx,tile){
  if(tile.t!=='num')return 0;
  const discards=GS.playerDiscards[oppIdx]||[];
  const scnt={wan:0,tong:0,tiao:0};
  for(const d of discards){if(d.t==='num')scnt[d.s]++;}
  const total=scnt.wan+scnt.tong+scnt.tiao;
  if(total<3)return 0; // 样本太少不推理
  
  // 对手弃牌集中在某花色 → 该花色安全，其他花色危险
  const maxS=Object.entries(scnt).sort((a,b)=>b[1]-a[1])[0];
  if(maxS[1]>=total*0.6 && maxS[0]!==tile.s)return AI_STRATEGY.safety.opponentSuitDanger; // Discarding outside the opponent's discarded suit is riskier.
  return 0;
}

function aiPhase(){
  return GS.turn<=24?'early':GS.turn<=48?'mid':'late';
}

function compareAiRoutes(a,b){
  return AI_RULE_CORE.compareRoutes(a,b);
}

function aiRouteSummary(hand){
  const routes=[
    {p:'norm',v:calcShanten(hand)},
    {p:'7p',v:calcShanten7Pairs(hand)},
    {p:'dalan',v:calcShantenDalan(hand)},
    {p:'quanzheng',v:calcShantenZhengzong(hand)},
    {p:'banzheng',v:calcShantenBanzhengzong(hand)}
  ];
  routes.sort(compareAiRoutes);
  return routes[0];
}

function aiFixedMeldCount(playerIdx){
  const player=GS.players[playerIdx];
  return player&&player.melds?player.melds.filter(function(m){return (m.count||0)>=3;}).length:0;
}

function aiRouteValuesForPlayer(hand,playerIdx,extraMeld){
  const evaluationHand=[...hand];
  const melds=GS.players[playerIdx]&&GS.players[playerIdx].melds?GS.players[playerIdx].melds:[];
  for(const meld of melds){
    if((meld.count||0)<3)continue;
    for(let i=0;i<3;i++)evaluationHand.push(meld.tile);
  }
  if(extraMeld&&extraMeld.tile){
    for(let i=0;i<3;i++)evaluationHand.push(extraMeld.tile);
  }
  const hasFixedMeld=aiFixedMeldCount(playerIdx)+(extraMeld&&extraMeld.tile?1:0)>0;
  return {
    norm:calcShanten(evaluationHand),
    '7p':hasFixedMeld?99:calcShanten7Pairs(hand),
    dalan:hasFixedMeld?99:calcShantenDalan(hand),
    quanzheng:hasFixedMeld?99:calcShantenZhengzong(hand),
    banzheng:hasFixedMeld?99:calcShantenBanzhengzong(hand)
  };
}

function aiRouteSummaryForPlayer(hand,playerIdx,extraMeld){
  const values=aiRouteValuesForPlayer(hand,playerIdx,extraMeld);
  const routes=[
    {p:'norm',v:values.norm},
    {p:'7p',v:values['7p']},
    {p:'dalan',v:values.dalan},
    {p:'quanzheng',v:values.quanzheng},
    {p:'banzheng',v:values.banzheng}
  ];
  routes.sort(compareAiRoutes);
  return routes[0];
}

function aiBestShantenForPlayer(hand,playerIdx,extraMeld){
  return aiRouteSummaryForPlayer(hand,playerIdx,extraMeld).v;
}

function evaluateDiscardCandidates(hand,playerIdx,options){
  options=options||{};
  const candidateIndices=options.candidateIndices||hand.map(function(_,i){return i;});
  const details=[];
  let bestShanten=Infinity,bestCands=[],bestPaths=[];
  for(let ci=0;ci<candidateIndices.length;ci++){
    const i=candidateIndices[ci];
    const sub=hand.filter(function(_,j){return j!==i;});
    const routeValues=aiRouteValuesForPlayer(sub,playerIdx,options.extraMeld);
    const pairCount=function(){const c={};for(const t of sub)c[t.k]=(c[t.k]||0)+1;let p=0;for(const v of Object.values(c))if(v>=2)p++;return p;}();
    const s7c=pairCount<3?routeValues['7p']+2:pairCount===3?routeValues['7p']+1:routeValues['7p'];
    const routes=[
      {p:'norm',v:routeValues.norm},
      {p:'7p',v:s7c},
      {p:'dalan',v:routeValues.dalan},
      {p:'quanzheng',v:routeValues.quanzheng},
      {p:'banzheng',v:routeValues.banzheng}
    ];
    routes.sort(compareAiRoutes);
    const top=routes[0];
    const ruleMelds=ruleMeldsWithExtra(playerIdx,options.extraMeld);
    const waitKeys=(top.p==='norm'||top.p==='7p')?listWaitsWithMelds(sub,playerIdx,ruleMelds,tkey(hand[i])):[];
    const displayShanten=waitKeys.length>0?Math.min(top.v,0):top.v;
    details.push({tile:hand[i],idx:i,sub:sub,sN:routeValues.norm,s7:routeValues['7p'],sD:routeValues.dalan,sZ:routeValues.quanzheng,sBZ:routeValues.banzheng,s:displayShanten,path:top.p,routes:routes,waits:waitKeys,breaksMeld:aiBreaksMeld(hand,i),breaksPair:aiBreaksPair(hand,i),breaksTaatsu:aiBreaksTaatsu(hand,i),windComboBreak:aiBreaksWindCombo(hand,i),dragonComboBreak:aiBreaksDragonCombo(hand,i),isolatedDiscardPriority:aiIsolatedDiscardPriority(hand,i)});
    if(displayShanten<bestShanten){bestShanten=displayShanten;bestCands=[i];bestPaths=[top.p];}
    else if(displayShanten===bestShanten){bestCands.push(i);bestPaths.push(top.p);}
  }
  return {bestShanten:bestShanten,bestCands:bestCands,bestPaths:bestPaths,candDetails:details};
}

function aiBreaksMeld(h,idx){
  const t=h[idx];
  const sub=h.filter(function(_,j){return j!==idx;});
  if(h.filter(function(x){return teq(x,t);}).length>=3)return true;
  if(t.t==='num'){
    const s=t.s,v=t.v;
    if(sub.some(function(x){return x.t==='num'&&x.s===s&&x.v===v-1;})&&sub.some(function(x){return x.t==='num'&&x.s===s&&x.v===v+1;}))return true;
    if(sub.some(function(x){return x.t==='num'&&x.s===s&&x.v===v+1;})&&sub.some(function(x){return x.t==='num'&&x.s===s&&x.v===v+2;}))return true;
    if(sub.some(function(x){return x.t==='num'&&x.s===s&&x.v===v-2;})&&sub.some(function(x){return x.t==='num'&&x.s===s&&x.v===v-1;}))return true;
  }
  return false;
}

function aiBreaksPair(h,idx){
  const t=h[idx];
  return h.filter(function(x){return teq(x,t);}).length>=2;
}

function aiBreaksTaatsu(h,idx){
  const t=h[idx];
  const sub=h.filter(function(_,j){return j!==idx;});
  if(t.t==='num'){
    return sub.some(function(x){return x.t==='num'&&x.s===t.s&&(Math.abs(x.v-t.v)===1||Math.abs(x.v-t.v)===2);});
  }
  if(t.t==='honor'){
    const winds=['dong','nan','xi','bei'],dragons=['zhong','fa','bai'];
    const group=winds.includes(t.s)?winds:dragons.includes(t.s)?dragons:null;
    return !!group&&sub.some(function(x){return x.t==='honor'&&group.includes(x.s)&&x.s!==t.s;});
  }
  return false;
}

function aiBreaksWindCombo(h,idx){
  const t=h[idx];
  if(!t||t.t!=='honor'||!['dong','nan','xi','bei'].includes(t.s))return false;
  if(h.filter(function(x){return teq(x,t);}).length!==1)return false;
  const sub=h.filter(function(_,j){return j!==idx;});
  return sub.some(function(x){return x.t==='honor'&&['dong','nan','xi','bei'].includes(x.s)&&x.s!==t.s;});
}

function aiDragonKinds(h){
  const dragons=['zhong','fa','bai'];
  let n=0;
  for(const d of dragons)if(h.some(function(x){return x.t==='honor'&&x.s===d;}))n++;
  return n;
}

function aiShouldProtectDragonCombo(h){
  const kinds=aiDragonKinds(h);
  if(kinds>=3)return true;
  if(kinds<2)return false;
  return h.some(function(x){return x.t==='honor'&&x.s==='zhong';});
}

function aiBreaksDragonCombo(h,idx){
  const t=h[idx];
  if(!t||t.t!=='honor'||!['zhong','fa','bai'].includes(t.s))return false;
  if(h.filter(function(x){return teq(x,t);}).length!==1)return false;
  if(!aiShouldProtectDragonCombo(h))return false;
  const before=aiDragonKinds(h);
  const sub=h.filter(function(_,j){return j!==idx;});
  return aiDragonKinds(sub)<before;
}

function aiUnprotectedSingleHonor(h,idx){
  const t=h[idx];
  if(!t||t.t!=='honor')return false;
  if(h.filter(function(x){return teq(x,t);}).length!==1)return false;
  if(aiBreaksDragonCombo(h,idx))return false;
  if(aiBreaksTaatsu(h,idx))return false;
  return true;
}

function aiIsolatedDiscardPriority(h,idx){
  const t=h[idx];
  if(!t)return 0;
  if(h.filter(function(x){return teq(x,t);}).length!==1)return 0;
  if(aiBreaksDragonCombo(h,idx))return 0;
  if(aiUnprotectedSingleHonor(h,idx))return 5;
  if(t.t!=='num')return 0;
  const has=function(offset){
    return h.some(function(x){return x.t==='num'&&x.s===t.s&&x.v===t.v+offset;});
  };
  if(has(-2)||has(-1)||has(1)||has(2))return 0;
  if(t.v===1||t.v===9)return 4;
  if(t.v===2||t.v===8)return 3;
  if(t.v===3||t.v===7)return 2;
  return 1;
}

function visibleEdgeIsolatedAdj(hand,idx,playerIdx){
  const tile=hand[idx];
  if(!tile||tile.t!=='num')return 0;
  if(hand.filter(function(t){return teq(t,tile);}).length!==1)return 0;
  if(aiBreaksMeld(hand,idx)||aiBreaksTaatsu(hand,idx)||aiBreaksPair(hand,idx))return 0;
  if(tile.v!==1&&tile.v!==9)return 0;
  const key=tile.s+(tile.v===1?2:8);
  const remain=aiRemainingCountForWait(key,playerIdx,hand.filter(function(_,j){return j!==idx;}),tile);
  return remain<=1?6:remain===2?3:0;
}

function aiRemainingCountForWait(tileKey,playerIdx,handAfterDiscard,discardTile){
  let visible=0;
  for(const t of handAfterDiscard||[])if(tkey(t)===tileKey)visible++;
  if(discardTile&&tkey(discardTile)===tileKey)visible++;
  for(let pi=0;pi<4;pi++){
    for(const d of (GS.playerDiscards[pi]||[]))if(tkey(d)===tileKey)visible++;
    const melds=GS.players[pi]&&GS.players[pi].melds?GS.players[pi].melds:[];
    for(const m of melds)if(tkey(m.tile)===tileKey)visible+=m.count||3;
  }
  return Math.max(0,4-visible);
}

function aiWaitInfoAfterDiscard(sub,playerIdx,route,discardTile){
  if(route!=='norm'&&route!=='7p')return {count:0,remaining:0,tiles:[]};
  try{
    const waits=listWaits(sub,playerIdx);
    const tiles=waits.map(function(k){return {tile:k,remaining:aiRemainingCountForWait(k,playerIdx,sub,discardTile)};}).filter(function(w){return w.remaining>0;});
    const remaining=tiles.reduce(function(sum,w){return sum+w.remaining;},0);
    return {count:tiles.length,remaining:remaining,tiles:tiles};
  }catch(e){return {count:0,remaining:0,tiles:[]};}
}

function mctsPublicMelds(){
  const rows=[];
  for(let p=0;p<4;p++){
    const melds=GS.players[p]&&GS.players[p].melds?GS.players[p].melds:[];
    for(const meld of melds)rows.push({player:p,tile:tkey(meld.tile),count:meld.count||3,type:meld.type||''});
  }
  return rows;
}

function mctsOpponentThreats(playerIdx){
  const threats=[];
  for(let p=0;p<4;p++){
    if(p===playerIdx)continue;
    const river=(GS.playerDiscards&&GS.playerDiscards[p])||[];
    const melds=GS.players[p]&&GS.players[p].melds?GS.players[p].melds:[];
    const dl=typeof dangerLevel==='function'?dangerLevel(playerIdx):0;
    const late=GS.turn>=48?0.25:0;
    const meldRisk=Math.min(0.45,melds.length*0.18);
    const riverRisk=Math.min(0.25,river.length*0.015);
    const tenpaiRisk=Math.max(0,Math.min(1,dl*0.15+meldRisk+riverRisk+late));
    const dalanRisk=Math.max(0,Math.min(1,(melds.some(function(m){return m&&m.tile&&m.tile.t==='honor';})?0.25:0)+riverRisk+(GS.turn>=36?0.15:0)));
    const honorRisk=Math.max(0,Math.min(1,(melds.filter(function(m){return m&&m.tile&&m.tile.t==='honor';}).length*0.25)+late));
    threats.push({player:p,tenpaiRisk:tenpaiRisk,dalanRisk:dalanRisk,honorRisk:honorRisk});
  }
  return threats;
}

function mctsActionText(candidate){
  if(!candidate)return '';
  if(candidate.action==='discard')return '打'+(candidate.tileLabel||candidate.tile||'');
  if(candidate.action==='pong')return '碰'+(candidate.tileLabel||candidate.tile||'');
  if(candidate.action==='kong')return '杠'+(candidate.tileLabel||candidate.tile||'');
  if(candidate.action==='win')return '胡';
  return '过';
}

function mctsCandidateFromDiscardDetail(detail,hand,playerIdx,strongActionText,candScores){
  const tile=hand[detail.idx]||detail.tile;
  const key=tkey(tile);
  const route=detail.path||'norm';
  const scoreInfo=candScores&&candScores[detail.idx]?candScores[detail.idx]:null;
  const mixedInfo=mixedStrongDiscardInfo(hand,tile);
  const waitInfo=aiWaitInfoAfterDiscard(detail.sub||hand.filter(function(_,j){return j!==detail.idx;}),playerIdx,route,tile);
  const base=(scoreInfo?scoreInfo.sc:0)-(detail.s||0)*2+(waitInfo.remaining||0)*0.25;
  const action={id:'discard:'+detail.idx+':'+key,action:'discard',tile:key,tileLabel:lbl(tile),legal:true,baseScore:base,shantenAfter:detail.s,route:route,breaksRoute:!!(detail.breaksMeld||detail.breaksPair||detail.breaksTaatsu||detail.dragonComboBreak||detail.windComboBreak),coreSequenceBreak:!!detail.breaksMeld,breaksPair:!!detail.breaksPair,windComboBreak:!!detail.windComboBreak,dragonComboBreak:!!detail.dragonComboBreak,isolatedDiscardPriority:detail.isolatedDiscardPriority||0,publicSeenCount:visibleTileCount(tile),mixedRouteType:mixedInfo.type,mixedRouteReason:mixedInfo.reason,defenseRisk:Math.max(0,1-Math.min(1,defenseScore(tile,playerIdx)/8)),dealInRisk:Math.max(0,Math.min(1,dangerLevel(playerIdx)/5)),kongRisk:0,scoreImpact:route==='dalan'||route==='quanzheng'||route==='banzheng'?2:0,waitCount:waitInfo.count,waitRemaining:waitInfo.remaining};
  action.isStrongRuleChoice=mctsActionText(action)===strongActionText;
  return action;
}

function mctsSummaryFinalCandidate(summary,candidates){
  if(!summary)return null;
  return (candidates||[]).find(function(candidate){return mctsActionText(candidate)===summary.finalAction;})||null;
}

function responseActionText(candidate){
  if(!candidate)return '';
  return mctsActionText(candidate)+'@'+String(candidate.id||'').split(':')[1];
}

function mctsSummaryFinalResponseCandidate(summary,candidates,strong){
  if(!summary)return strong||null;
  const action=summary.finalAction;
  const matches=(candidates||[]).filter(function(candidate){return candidate.legal&&mctsActionText(candidate)===action;});
  if(action==='过')return null;
  if(matches.length){
    matches.sort(function(a,b){return (b.baseScore||0)-(a.baseScore||0);});
    return matches[0];
  }
  return mctsSummaryFinalCandidate(summary,candidates)||strong||null;
}

function buildAiDecisionLog(hand,playerIdx,discardIdx,source,reason,extra){
  const before=aiRouteSummaryForPlayer(hand,playerIdx);
  const candidates=[];
  let selectedRoute=null;
  for(let i=0;i<hand.length;i++){
    const sub=hand.filter(function(_,j){return j!==i;});
    const route=aiRouteSummaryForPlayer(sub,playerIdx);
    const breaksM=aiBreaksMeld(hand,i);
    const breaksP=aiBreaksPair(hand,i);
    const breaksT=aiBreaksTaatsu(hand,i);
    const dragonComboBreak=aiBreaksDragonCombo(hand,i);
    const isolatedPriority=aiIsolatedDiscardPriority(hand,i);
    const waitInfo=aiWaitInfoAfterDiscard(sub,playerIdx,route.p,hand[i]);
    const waitCount=waitInfo.count;
    const defense=defenseScore(hand[i],playerIdx);
    const structurePenalty=(breaksM?6:0)+(breaksP?4:0)+(breaksT?2:0)+(dragonComboBreak?6:0);
    const finalScore=Number((-route.v*100+waitCount*4+waitInfo.remaining+defense-structurePenalty+isolatedPriority*2).toFixed(2));
    if(i===discardIdx)selectedRoute=route;
    candidates.push({
      idx:i,
      tile:tkey(hand[i]),
      tileLabel:lbl(hand[i]),
      shantenAfter:route.v,
      route:route.p,
      breaksMeld:breaksM,
      breaksPair:breaksP,
      breaksTaatsu:breaksT,
      dragonComboBreak:dragonComboBreak,
      isolatedDiscardPriority:isolatedPriority,
      waitCount:waitCount,
      waitRemaining:waitInfo.remaining,
      waitTiles:waitInfo.tiles,
      structureScore:-structurePenalty,
      defenseScore:defense,
      routeScore:-route.v,
      finalScore:finalScore
    });
  }
  const selected=hand[discardIdx];
  const after=selectedRoute||aiRouteSummaryForPlayer(hand.filter(function(_,j){return j!==discardIdx;}),playerIdx);
  const danger=dangerLevel(playerIdx);
  const phase=aiPhase();
  const defenseProfile=aiDefenseProfile(playerIdx,danger,phase,after.v);
  const threat=maxOpponentThreat(playerIdx);
  return Object.assign({
    player:playerIdx,
    phase:phase,
    hand:hand.map(function(t){return tkey(t);}),
    discard:selected?tkey(selected):null,
    discardLabel:selected?lbl(selected):null,
    source:source||'rule',
    route:after.p,
    shantenBefore:before.v,
    shantenAfter:after.v,
    candidates:candidates,
    reason:reason||'规则 AI 按综合向听和结构保护选择',
    defenseMode:defenseProfile.mode,
    attackTolerance:defenseProfile.attackTolerance,
    defenseWeight:defenseProfile.weight,
    scorePosition:defenseProfile.scorePosition,
    threatLevel:threat
  },extra||{});
}

function topUnifiedCandidates(decisionLog){
  return (decisionLog.candidates||[]).slice().sort(function(a,b){
    return (b.finalScore||0)-(a.finalScore||0);
  }).slice(0,5).map(function(candidate){
    return {
      tile:candidate.tile,
      tileLabel:candidate.tileLabel,
      shantenAfter:candidate.shantenAfter,
      route:candidate.route,
      finalScore:candidate.finalScore,
      reasonCode:candidate.breaksMeld?'breaks-meld':candidate.breaksPair?'breaks-pair':candidate.breaksTaatsu?'breaks-taatsu':'normal'
    };
  });
}
function aiDecisionAnomalyFromLog(decisionLog,unified){
  const selected=(decisionLog.candidates||[]).find(function(candidate){return candidate.tile===decisionLog.discard;})||{};
  const top=(decisionLog.candidates||[]).slice().sort(function(a,b){return (b.finalScore||0)-(a.finalScore||0);})[0]||selected;
  const anomalies=[];
  if(decisionLog.shantenAfter>decisionLog.shantenBefore)anomalies.push({reasonCode:'shanten-regression',riskLabel:'退向听'});
  if(selected.dragonComboBreak)anomalies.push({reasonCode:'breaks-complete-dragon-combo',riskLabel:'拆中发白完整组合'});
  if(selected.breaksMeld)anomalies.push({reasonCode:'breaks-meld',riskLabel:'拆完整顺子/刻子'});
  if(selected.breaksPair)anomalies.push({reasonCode:'breaks-pair',riskLabel:'拆对子将牌'});
  if(selected.breaksTaatsu)anomalies.push({reasonCode:'breaks-taatsu',riskLabel:'拆搭子'});
  if(top&&top.tile&&top.tile!==selected.tile&&Number(top.finalScore||0)>Number(selected.finalScore||0)+8){
    anomalies.push({reasonCode:'candidate-score-conflict',riskLabel:'候选排序与分数矛盾'});
  }
  if(unified&&unified.mctsSummary&&unified.mctsSummary.mctsAction&&unified.mctsSummary.finalAction&&unified.mctsSummary.mctsAction!==unified.mctsSummary.finalAction){
    anomalies.push({reasonCode:'mcts-final-conflict',riskLabel:'MCTS 与最终选择冲突'});
  }
  return anomalies;
}

function finalDecisionGuardBreakRank(candidate){
  if(!candidate)return 0;
  if(candidate.dragonComboBreak)return 5;
  if(candidate.breaksPair)return 4;
  if(candidate.breaksMeld)return 3;
  if(candidate.breaksTaatsu)return 1;
  return 0;
}

function finalDecisionGuardHasClearDefense(decisionLog,candidate){
  if(!candidate)return false;
  if(decisionLog.defenseMode==='fullFold')return true;
  if(decisionLog.defenseMode==='semiFold'&&Number(candidate.defenseScore||0)>=6)return true;
  return false;
}

function candidateNumber(value,defaultValue){
  const number=Number(value);
  return Number.isFinite(number)?number:defaultValue;
}

function finalDecisionGuardSort(a,b){
  const shantenDiff=candidateNumber(a.shantenAfter,99)-candidateNumber(b.shantenAfter,99);
  if(shantenDiff)return shantenDiff;
  const breakDiff=finalDecisionGuardBreakRank(a)-finalDecisionGuardBreakRank(b);
  if(breakDiff)return breakDiff;
  const waitDiff=Number(b.waitRemaining||0)-Number(a.waitRemaining||0);
  if(waitDiff)return waitDiff;
  return Number(b.finalScore||0)-Number(a.finalScore||0);
}

function finalDecisionGuard(hand,playerIdx,idx,source,reason,extra){
  const initialLog=buildAiDecisionLog(hand,playerIdx,idx,source,reason,extra);
  const candidates=initialLog.candidates||[];
  const selected=candidates.find(function(candidate){return candidate.idx===idx;})||candidates.find(function(candidate){return candidate.tile===initialLog.discard;})||null;
  if(!selected||!candidates.length)return {idx:idx,source:source,reason:reason,extra:extra,decisionLog:initialLog,triggered:false};
  const bestShanten=Math.min.apply(null,candidates.map(function(candidate){return candidateNumber(candidate.shantenAfter,99);}));
  const bestCandidates=candidates.filter(function(candidate){return candidateNumber(candidate.shantenAfter,99)===bestShanten;});
  const hasTenpaiCandidate=bestCandidates.some(function(candidate){return candidateNumber(candidate.shantenAfter,99)<=0;});
  const selectedBreakRank=finalDecisionGuardBreakRank(selected);
  const blocked=[];
  if(candidateNumber(selected.shantenAfter,99)>bestShanten+1)blocked.push('shanten-regression');
  if(hasTenpaiCandidate&&candidateNumber(selected.shantenAfter,99)>bestShanten)blocked.push('abandons-tenpai');
  if(selected.dragonComboBreak)blocked.push('breaks-complete-dragon-combo');
  if(selected.breaksPair)blocked.push('breaks-pair');
  if((selectedBreakRank>=3||blocked.length>0)&&!finalDecisionGuardHasClearDefense(initialLog,selected)){
    const pool=bestCandidates.filter(function(candidate){
      return !candidate.dragonComboBreak&&finalDecisionGuardBreakRank(candidate)<selectedBreakRank;
    }).sort(finalDecisionGuardSort);
    const fallback=pool[0]||candidates.filter(function(candidate){return !candidate.dragonComboBreak;}).sort(finalDecisionGuardSort)[0];
    if(fallback&&Number.isFinite(fallback.idx)&&fallback.idx!==idx){
      const guardExtra=Object.assign({},extra||{},{
        finalDecisionGuard:{
          triggered:true,
          originalTile:selected.tile,
          originalTileLabel:selected.tileLabel,
          finalTile:fallback.tile,
          finalTileLabel:fallback.tileLabel,
          blockedReasonCodes:blocked,
          reason:'high-risk-final-discard-blocked'
        }
      });
      return {
        idx:fallback.idx,
        source:'final-decision-guard',
        reason:'最终出牌前拦截高危候选，回退到不拆中发白/对子且向听最优的候选',
        extra:guardExtra,
        decisionLog:buildAiDecisionLog(hand,playerIdx,fallback.idx,'final-decision-guard','最终出牌前拦截高危候选，回退到不拆中发白/对子且向听最优的候选',guardExtra),
        triggered:true
      };
    }
  }
  return {idx:idx,source:source,reason:reason,extra:extra,decisionLog:initialLog,triggered:false};
}
function appendUnifiedDecisionResult(unified){
  const log=ensureRecommendationLog();
  if(!log||!unified||unified.player===0)return;
  log.aiDecisionSummary.push(unified.summary);
  if(log.aiDecisionSummary.length>120)log.aiDecisionSummary=log.aiDecisionSummary.slice(-120);
  (unified.anomalies||[]).forEach(function(item){
    log.aiDecisionAnomalies.push(Object.assign({
      turn:unified.turn,
      player:unified.player,
      discard:unified.summary.discard,
      discardLabel:unified.summary.discardLabel,
      needsReview:true
    },item));
  });
  if(log.aiDecisionAnomalies.length>80)log.aiDecisionAnomalies=log.aiDecisionAnomalies.slice(-80);
}
function createUnifiedDecisionResult(hand,playerIdx,options){
  options=options||{};
  const finalIdx=Number.isFinite(options.finalIdx)?options.finalIdx:0;
  const source=options.source||'rule';
  const reason=options.reason||'统一决策内核按候选排序、结构保护和后续复核选择';
  const extra=options.extra||{};
  const decisionLog=buildAiDecisionLog(hand,playerIdx,finalIdx,source,reason,extra);
  const unified={
    schemaVersion:'stage7-unified-decision-v1',
    turn:GS.turn||0,
    player:playerIdx,
    source:source,
    finalTile:decisionLog.discard,
    finalTileLabel:decisionLog.discardLabel,
    shantenBefore:decisionLog.shantenBefore,
    shantenAfter:decisionLog.shantenAfter,
    route:decisionLog.route,
    mctsSummary:extra.mctsSummary||null,
    topCandidates:topUnifiedCandidates(decisionLog),
    decisionLog:decisionLog
  };
  const anomalies=aiDecisionAnomalyFromLog(decisionLog,unified);
  unified.anomalies=anomalies;
  unified.summary={
    turn:unified.turn,
    player:playerIdx,
    handSummary:decisionLog.hand,
    discard:decisionLog.discard,
    discardLabel:decisionLog.discardLabel,
    route:decisionLog.route,
    shantenAfter:decisionLog.shantenAfter,
    source:source,
    topCandidates:unified.topCandidates,
    mainReason:reason,
    reasonCode:anomalies.length?anomalies[0].reasonCode:'normal',
    needsReview:anomalies.length>0
  };
  if(options.record)appendUnifiedDecisionResult(unified);
  return unified;
}

function strongAiMeldsForPlayer(playerIdx){
  const player=GS.players[playerIdx]||{melds:[]};
  return (player.melds||[]).map(function(m){
    const tile=tkey(m.tile||m.tiles&&m.tiles[0]||m);
    const count=m.count||3;
    const type=count>=4?'mingGang':'peng';
    return {type:type,tiles:Array.from({length:count},function(){return tile;})};
  });
}

function strongAiStateForPlayer(hand,playerIdx){
  const melds=[0,1,2,3].map(function(p){return strongAiMeldsForPlayer(p);});
  return {
    hand:hand.map(tkey),
    melds:melds,
    discards:(GS.playerDiscards||GS.discards||[[],[],[],[]]).map(function(row){return (row||[]).map(tkey);}),
    scores:GS.players.map(function(p){return p.score;}),
    turn:Math.max(1,Math.ceil((GS.turn||1)/4)),
    currentPlayer:playerIdx,
    dealer:GS.dealer||0,
    wallRemaining:GS.wall?GS.wall.length:70,
    newDrawnTile:GS.newDrawnTile?tkey(GS.newDrawnTile):undefined
  };
}

function chooseStrongRuleDiscard(hand,playerIdx){

          for(let v=1;v<=9;v++){
            const k=suit+v;
            if((cnt[k]||0)===2&&remainingCount(k)<=1)return true;
            if(v<=8&&(cnt[k]||0)>0&&(cnt[suit+(v+1)]||0)>0){
              const waits=[];
              if(v>1)waits.push(suit+(v-1));
              if(v+2<=9)waits.push(suit+(v+2));
              const remaining=waits.reduce(function(sum,w){return sum+remainingCount(w);},0);
              if(remaining<=1)return true;
            }
            if(v<=7&&(cnt[k]||0)>0&&(cnt[suit+(v+2)]||0)>0&&remainingCount(suit+(v+1))<=1)return true;
          }
        }
        return false;
      }
      const deadFlags=bestCands.map(i=>{const sub=hand.filter((_,j)=>j!==i);return hasDeadTaatsu(sub);});
      const aliveCands=bestCands.filter((_,ci)=>!deadFlags[ci]);
      if(aliveCands.length>0){
        const orig=bestCands;
        bestCands=aliveCands;
        subHands=aliveCands.map(i=>subHands[orig.indexOf(i)]);
        bestPaths=aliveCands.map(i=>bestPaths[orig.indexOf(i)]);
      }
    }const danger=dangerLevel(playerIdx);
    const phase=GS.turn<=24?'early':GS.turn<=48?'mid':'late';
    const defenseProfile=aiDefenseProfile(playerIdx,danger,phase,bestShanten);
    let safeW=defenseProfile.weight;
    
    // Full fold may trade one or more shanten steps for the safest discard.
    if(defenseProfile.mode==='fullFold'){
      let safestIdx=0,safest=-Infinity,safestShanten=Infinity,safestStructure=Infinity;
      hand.forEach(function(_,i){
        let sc=defenseScore(hand[i],playerIdx);
        if(hand[i].t==='honor')sc+=AI_STRATEGY.safety.honor;
        else if(hand[i].v===1||hand[i].v===9)sc+=AI_STRATEGY.safety.terminal;
        const candidateShanten=combinedShanten(hand.filter(function(_,j){return j!==i;}));
        const structure=(breaksMeld(hand,i)?2:0)+(breaksPair(hand,i)?1:0)+(aiBreaksWindCombo(hand,i)?2:0);
        if(sc>safest||(sc===safest&&candidateShanten<safestShanten)||(sc===safest&&candidateShanten===safestShanten&&structure<safestStructure)){
          safest=sc;safestIdx=i;safestShanten=candidateShanten;safestStructure=structure;
        }
      });
      return commitAiChoice(safestIdx,'rule','完全弃和模式从全部手牌中优先选择安全牌',{foldCandidateShanten:safestShanten});
    }
    
    // 未听牌：搭子质量 + 安全度 + 染手偏向
    const bias=suitBias(effH);
    let bestScore=-Infinity,bestIdx=bestCands[0];
    bestCands.forEach((i,ci)=>{
      let q;
      const p=bestPaths[ci];
      if(p==='dalan'){
        q=dalanDiscardScore(hand[i],subHands[ci]);
      }else if(p==='quanzheng'){
        q=dalanDiscardScore(hand[i],subHands[ci])+zhengzongDiscardBonus(hand[i],subHands[ci]);
      }else if(p==='banzheng'){
        q=dalanDiscardScore(hand[i],subHands[ci])+zhengzongDiscardBonus(hand[i],subHands[ci])*0.5;
      }else{
        q=handPotential(subHands[ci]);
      }
      if(p==='7p'){
        const origCnt=hand.filter(h=>teq(h,hand[i])).length;
        if(origCnt===1)q+=4;
        if(hand[i].t==='honor'&&origCnt===1)q+=2;
      }
      if(aiBreaksDragonCombo(hand,i))q-=8;
      const singleHonorDiscard=aiUnprotectedSingleHonor(hand,i);
      const isoDefenseDiff=Math.max(...bestCands.map(k=>defenseScore(hand[k],playerIdx)))-Math.min(...bestCands.map(k=>defenseScore(hand[k],playerIdx)));
      if(aiCanUseIsolatedTieBreak(playerIdx,danger,phase,bestShanten,isoDefenseDiff))q+=aiIsolatedDiscardPriority(hand,i)*0.25;
      // 染手偏向：保留主色牌（仅面子手路径）
      if(p==='norm'){
        if(bias.type==='clear' && hand[i].t==='num' && hand[i].s===bias.suit)q-=6;
        else if(bias.type==='mixed' && hand[i].t==='num' && hand[i].s===bias.suit)q-=6;
        else if(bias.type==='mixed' && hand[i].t==='honor')q-=5;
        else if(bias.type==='semi-clear' && hand[i].t==='num' && hand[i].s===bias.suit)q-=3;
        else if(bias.type==='mixed-lean' && hand[i].t==='num' && hand[i].s===bias.suit)q-=3;
        else if(bias.type==='mixed-lean' && hand[i].t==='honor' && !singleHonorDiscard)q-=2;
        if(singleHonorDiscard)q+=3;
      }
      // 字牌混一色潜力：无染手倾向但主色≥4且字牌≥2时温和保留
      if(p==='norm' && bias.type==='none' && hand[i].t==='honor' && !singleHonorDiscard){
        const honorCnt=hand.filter(h=>h.t==='honor').length;
        if(bias.count>=4 && honorCnt>=2)q-=0.5;
      }
      // 对子保留惩罚：弃掉对子 → 降低弃牌优先级
      if(p==='norm'){
        const tileCnt=hand.filter(h=>teq(h,hand[i])).length;
        if(tileCnt===2){
          const isPairTaatsu=breaksPairTaatsu(hand,i);
          const skipBias=(bias.type==='clear'||bias.type==='mixed'||bias.type==='semi-clear')&&hand[i].t==='num'&&hand[i].s!==bias.suit;
          if(!skipBias){
            // 搭子+对子结构（如788）：重罚，避免破坏搭子
            if(isPairTaatsu)q-=6;
            else q-=3;  // 普通对子，加重惩罚（-2→-3）
            // 混合路线对子叠加保护：mixed 染手方向的对子额外锁定
            if(bias.type==='mixed')q-=2;  // 加重（-1→-2）
            // mixed-lean 染手：对子也需保护（防止误拆）
            if(bias.type==='mixed-lean'&&hand[i].t==='num'&&hand[i].s===bias.suit)q-=2;
            if(bias.type==='mixed-lean'&&hand[i].t==='honor')q-=1;
          }
        }
      }
      // 字牌搭子保护：有中+发或东+南等字牌搭子时，拆数牌对子受惩罚
      if(p==='norm'){
        const ht=detectHonorTaatsu(hand);
        if(ht.length>0&&hand.filter(h=>teq(h,hand[i])).length===2)q-=4;
      }
      // 序盘留宽
      if(phase==='early')q+=0.3;
      const s=defenseScore(hand[i],playerIdx);
      const score=q+safeW*s;
      if(score>bestScore){bestScore=score;bestIdx=i;}
    });
    return commitAiChoice(bestIdx,'rule','规则 AI 按向听、结构、防守和路线综合选择');
  }

function bestShanten(hand){
  return Math.min(calcShanten(hand),calcShanten7Pairs(hand),calcShantenDalan(hand),calcShantenZhengzong(hand),calcShantenBanzhengzong(hand));
}

function calledMeldShanten(handAfterCall,playerIdx,tile,mustDiscard){
  let route=mustDiscard?{p:'norm',v:Infinity}:aiRouteSummaryForPlayer(handAfterCall,playerIdx,{tile:tile});
  let discard=null;
  if(mustDiscard&&handAfterCall.length>0){
    for(let i=0;i<handAfterCall.length;i++){
      const sub=handAfterCall.filter(function(_,j){return j!==i;});
      const candidate=aiRouteSummaryForPlayer(sub,playerIdx,{tile:tile});
      if(candidate.v<route.v){route=candidate;discard=tkey(handAfterCall[i]);}
    }
  }
  return {raw:calcShanten(handAfterCall),adjusted:route.v,route:route.p,bestDiscard:discard};
}

function logAiResponseDecision(playerIdx,action,tile,beforeShanten,afterShanten,reason,extra){
  if(!GS._gameLog)return;
  if(!GS._gameLog.suggestLogs)GS._gameLog.suggestLogs=[];
  const phase=aiPhase();
  const danger=dangerLevel(playerIdx);
  const profile=aiDefenseProfile(playerIdx,danger,phase,afterShanten==null?beforeShanten:afterShanten);
  const threat=maxOpponentThreat(playerIdx);
  const entry=Object.assign({
    schemaVersion:'ai-decision-v1',
    turn:GS.turn,
    player:playerIdx,
    playerName:GS.players[playerIdx]?GS.players[playerIdx].name:'?',
    isAiDecision:true,
    decisionType:'response',
    action:action,
    tile:tile?tkey(tile):null,
    tileLabel:tile?lbl(tile):null,
    source:'rule',
    phase:phase,
    shantenBefore:beforeShanten,
    shantenAfter:afterShanten,
    reason:reason,
    defenseMode:profile.mode,
    attackTolerance:profile.attackTolerance,
    defenseWeight:profile.weight,
    scorePosition:profile.scorePosition,
    threatLevel:threat
  },extra||{});
  GS._gameLog.suggestLogs.push(entry);
  if(document.getElementById('ai-log-panel').style.display==='block')renderAiLogPanel();
  console.info('[AI response]',entry);
}

function responseHonorTreasureValue(tile,hand,action){
  const key=tkey(tile);
  if(!['zhong','fa','bai'].includes(key))return {bonus:0,riskDiscount:0,note:null};
  const count=(hand||[]).filter(function(item){return tkey(item)===key;}).length;
  if(count<2)return {bonus:0,riskDiscount:0,note:null};
  const isWhite=key==='bai';
  const actionBonus=action==='kong'?7:5;
  const pairBonus=count>=3?3:1;
  const bonus=actionBonus+pairBonus+(isWhite?2:0);
  return {bonus:bonus,riskDiscount:isWhite?0.35:0.25,note:(isWhite?'白板宝牌价值':'三元牌宝牌价值')+'已纳入'+(action==='kong'?'杠':'碰')+'牌收益评估'};
}

function logSkippedAiResponses(resp,t,summary,chosenPlayer){
  if(!Array.isArray(resp))return;
  for(const r of resp){
    if(r.p===chosenPlayer)continue;
    if(!r.cw&&!r.cp&&!r.ck)continue;
    const before=aiBestShantenForPlayer(GS.players[r.p].hand,r.p);
    const actions=[];
    if(r.cw)actions.push('胡');
    if(r.ck)actions.push('杠');
    if(r.cp)actions.push('碰');
    logAiResponseDecision(r.p,'pass',t,before,before,'本轮可响应候选已评估：'+actions.join('/')+'；最终采用'+(summary&&summary.finalAction?summary.finalAction:'过')+'，该玩家未执行响应',{mctsSummary:summary||null,availableActions:actions});
  }
}

function aiRespond(resp){
  if(GS.phase!=='responding')return;
  const t=GS.lastDiscard;
  let hadResponseOption=false;
  try{
    if(MCTS_ENHANCEMENT&&t){
      const candidates=[];
      const byId={};
      for(const r of resp){
        const curShanten=aiBestShantenForPlayer(GS.players[r.p].hand,r.p);
        if(r.cw){
          const c={id:'win:'+r.p,action:'win',tile:tkey(t),tileLabel:lbl(t),legal:true,baseScore:30,shantenAfter:-1,route:'response',defenseRisk:0,dealInRisk:0,kongRisk:0,scoreImpact:6,isStrongRuleChoice:true};
          candidates.push(c);byId[c.id]={resp:r,before:curShanten,after:-1};
        }
        if(r.ck){
          const hand=simAfterPongKong(GS.players[r.p].hand,t,3);
          const kongEval=calledMeldShanten(hand,r.p,t);
          const postShanten=kongEval.adjusted;
          const num=t.t==='num'?t.v:0;
          const treasure=responseHonorTreasureValue(t,GS.players[r.p].hand,'kong');
          const c={id:'kong:'+r.p,action:'kong',tile:tkey(t),tileLabel:lbl(t),legal:true,baseScore:(curShanten-postShanten)*4+4+treasure.bonus,shantenAfter:postShanten,route:kongEval.route||'response',defenseRisk:Math.max(0,Math.min(1,dangerLevel(r.p)/5-treasure.riskDiscount)),dealInRisk:Math.max(0,Math.min(1,dangerLevel(r.p)/5-treasure.riskDiscount)),kongRisk:Math.max(0,Math.min(1,(t.t==='honor'?0.55:0.2)+(num>=5?0.2:0)+(dangerLevel(r.p)*0.08)-treasure.riskDiscount)),scoreImpact:2+Math.round(treasure.bonus/3),isStrongRuleChoice:false,treasureNote:treasure.note};
          candidates.push(c);byId[c.id]={resp:r,before:curShanten,after:postShanten};
        }
        if(r.cp){
          const hand=simAfterPongKong(GS.players[r.p].hand,t,2);
          const pongEval=calledMeldShanten(hand,r.p,t,true);
          const postShanten=pongEval.adjusted;
          const treasure=responseHonorTreasureValue(t,GS.players[r.p].hand,'pong');
          const c={id:'pong:'+r.p,action:'pong',tile:tkey(t),tileLabel:lbl(t),legal:true,baseScore:(curShanten-postShanten)*4+2+treasure.bonus,shantenAfter:postShanten,route:pongEval.route||'response',defenseRisk:Math.max(0,Math.min(1,dangerLevel(r.p)/6-treasure.riskDiscount)),dealInRisk:Math.max(0,Math.min(1,dangerLevel(r.p)/6-treasure.riskDiscount)),kongRisk:0,scoreImpact:1+Math.round(treasure.bonus/4),isStrongRuleChoice:false,treasureNote:treasure.note};
          candidates.push(c);byId[c.id]={resp:r,before:curShanten,after:postShanten};
        }
        const pass={id:'pass:'+r.p,action:'pass',tile:tkey(t),tileLabel:lbl(t),legal:true,baseScore:r.cw?-20:1,shantenAfter:curShanten,route:'response',defenseRisk:0,dealInRisk:0,kongRisk:0,scoreImpact:0,isStrongRuleChoice:!r.cw&&!r.cp&&!r.ck};
        candidates.push(pass);byId[pass.id]={resp:r,before:curShanten,after:curShanten};
      }
      if(candidates.length){
        const strong=candidates.find(function(c){return c.isStrongRuleChoice;})||candidates.find(function(c){return c.action==='win';})||candidates[0];
        const summary=MCTS_ENHANCEMENT.decideWithMcts(mctsDecisionContext(strong.player||Number(strong.id.split(':')[1])||0,'responding',candidates,mctsActionText(strong),[]));
        appendMctsDecisionSummary(summary);
        const finalCandidate=mctsSummaryFinalResponseCandidate(summary,candidates,strong);
        if(!finalCandidate||finalCandidate.action==='pass'){
          logSkippedAiResponses(resp,t,summary,null);
          nextTurn();return;
        }
        const meta=byId[finalCandidate.id]||{};
        const r=meta.resp||resp[0];
        logSkippedAiResponses(resp,t,summary,r.p);
        if(finalCandidate.action==='win'){logAiResponseDecision(r.p,'win',t,meta.before,-1,summary.playerExplanation,{mctsSummary:summary,responseAction:responseActionText(finalCandidate),treasureNote:finalCandidate.treasureNote||null});applyWin(r.p,'点炮');return;}
        if(finalCandidate.action==='kong'){logAiResponseDecision(r.p,'kong',t,meta.before,meta.after,summary.playerExplanation,{mctsSummary:summary,responseAction:responseActionText(finalCandidate),treasureNote:finalCandidate.treasureNote||null});doKong(r.p);return;}
        if(finalCandidate.action==='pong'){logAiResponseDecision(r.p,'pong',t,meta.before,meta.after,summary.playerExplanation,{mctsSummary:summary,responseAction:responseActionText(finalCandidate),treasureNote:finalCandidate.treasureNote||null});doPong(r.p);return;}
        nextTurn();return;
      }
    }
  }catch(error){
    console.warn('[mcts-enhancement] response fallback to rule AI',error);
  }
  
  // 1. 能胡就胡
  for(let r of resp){if(r.cw){logAiResponseDecision(r.p,'win',t,aiBestShantenForPlayer(GS.players[r.p].hand,r.p),-1,'能胡优先胡');applyWin(r.p,'点炮');return;}}
  
  // 2. 杠：模拟杠后手牌，向听数不恶化才杠
  for(let r of resp){
    if(!r.ck)continue;
    hadResponseOption=true;
    const curShanten=aiBestShantenForPlayer(GS.players[r.p].hand,r.p);
    const hand=simAfterPongKong(GS.players[r.p].hand,t,3);
    const kongEval=calledMeldShanten(hand,r.p,t);
    const postShanten=kongEval.adjusted;
    const waitBefore=listWaitsWithMelds(GS.players[r.p].hand,r.p,ruleMeldsForPlayer(r.p));
    const waitAfter=listWaitsWithMelds(hand,r.p,ruleMeldsWithExtra(r.p,{tile:t,count:4}),tkey(t));
    const waitShape=AI_RULE_CORE.compareWaitShape(waitBefore,waitAfter);
    const lostWaits=waitShape.lostWaits;
    const waitShapePreserved=waitShape.preserved;
    const candidate={action:'kong',shantenAfter:postShanten,rawAfterShanten:kongEval.raw,routeAfter:kongEval.route,waitBefore:waitBefore,waitAfter:waitAfter,lostWaits:lostWaits};
    if(postShanten<=curShanten&&waitShapePreserved){logAiResponseDecision(r.p,'kong',t,curShanten,postShanten,waitBefore.length?'明杠后综合向听不恶化且完整保留听牌形，允许明杠':'明杠后综合向听不恶化，允许明杠',{candidates:[candidate]});doKong(r.p);return;}
    candidate.action='skipKong';
    const reason=!waitShapePreserved?'明杠会丢失原有待牌，选择过牌':'明杠后综合向听恶化，选择过牌';
    logAiResponseDecision(r.p,'skipKong',t,curShanten,postShanten,reason,{candidates:[candidate]});
  }
  
  // 3. 碰：向听数不恶化才碰
  const pongRate=1.0;
  for(let r of resp){
    if(!r.cp)continue;
    hadResponseOption=true;
    const curShanten=aiBestShantenForPlayer(GS.players[r.p].hand,r.p);
    const hand=simAfterPongKong(GS.players[r.p].hand,t,2);
    const pongEval=calledMeldShanten(hand,r.p,t,true);
    const postShanten=pongEval.adjusted;
    const _dl=dangerLevel(r.p);
    const _ph=GS.turn<=24?'early':GS.turn<=48?'mid':'late';
    const improves=postShanten<curShanten;
    const neutralAllowed=postShanten===curShanten&&!(_dl>=2&&_ph==='late');
    if((improves||neutralAllowed)&&Math.random()<pongRate){logAiResponseDecision(r.p,'pong',t,curShanten,postShanten,improves?'碰后弃牌的最佳结果改善综合向听，允许碰牌':'碰后弃牌的最佳结果不恶化综合向听，允许碰牌',{candidates:[{action:'pong',shantenAfter:postShanten,rawAfterShanten:pongEval.raw,routeAfter:pongEval.route,bestDiscard:pongEval.bestDiscard,danger:_dl,phase:_ph}]});doPong(r.p);return;}
  }
  
  if(hadResponseOption){
    const first=resp.find(function(r){return r.cp||r.ck;});
    if(first){const passShanten=aiBestShantenForPlayer(GS.players[first.p].hand,first.p);logAiResponseDecision(first.p,'pass',t,passShanten,passShanten,'碰杠收益不足、破坏听牌形或危险较高，选择过牌');}
  }
  nextTurn();
}

// 模拟碰/杠后手牌：从hand中移除n张与t相同的牌
function simAfterPongKong(hand,tile,n){
  const h=[...hand];let removed=0;
  for(let i=h.length-1;i>=0&&removed<n;i--){
    if(teq(h[i],tile)){h.splice(i,1);removed++;}
  }
  return h;
}

// 攻守判断：评估对手危险程度（副露数越多越危险）
function dangerLevel(playerIdx){
  let d=0;
  for(let i=0;i<4;i++){
    if(i===playerIdx)continue;
    const melds=GS.players[i].melds||[];
    if(melds.length>=2)d+=AI_STRATEGY.danger.twoMelds;
    else if(melds.length>=1)d+=AI_STRATEGY.danger.oneMeld;
    if(opponentThreatLevel(i)>=3)d+=AI_STRATEGY.danger.repeatedSafe;
  }
  if(aiPhase()==='late')d+=AI_STRATEGY.danger.late;
  const me=GS.players[playerIdx];
  if(me&&GS.players.some(function(p,idx){return idx!==playerIdx&&me.score>=p.score+20;}))d+=AI_STRATEGY.danger.scoreLead;
  return d;
}

function visibleTileCount(tile){
  let count=0;
  for(let pi=0;pi<4;pi++){
    for(const d of (GS.playerDiscards[pi]||[]))if(teq(d,tile))count++;
    const melds=GS.players[pi]&&GS.players[pi].melds?GS.players[pi].melds:[];
    for(const m of melds)if(teq(m.tile,tile))count+=m.count||3;
  }
  return count;
}

// 防守评分：安全牌得分高（在平手中优先被选为弃牌）
function defenseScore(tile,playerIdx){
  let score=0;
  let unsafeThreats=0;
  // Genbutsu is safe only against the opponent who discarded it.
  for(let i=0;i<4;i++){
    if(i===playerIdx)continue;
    if((GS.playerDiscards[i]||[]).some(d=>teq(d,tile)))score+=AI_STRATEGY.safety.opponentGenbutsu;
    else if(opponentThreatLevel(i)>=2)unsafeThreats++;
  }
  if(unsafeThreats>=2)score-=unsafeThreats*AI_STRATEGY.safety.multiOpponentDanger;
  // 筋牌安全：数牌才适用
  if(tile.t==='num'){
    for(let opp=0;opp<4;opp++){
      if(opp===playerIdx)continue;
      if(isSujiSafe(tile,opp))score+=AI_STRATEGY.safety.suji;
      if(isBlockedSuji(tile,opp,playerIdx))score+=AI_STRATEGY.safety.blockedSuji;
    }
  }
  // 对手范围推理：被对手弃牌集中的花色→减分（危险）
  if(tile.t==='num'){
    for(let opp=0;opp<4;opp++){
      if(opp===playerIdx)continue;
      score-=oppSuitDanger(opp,tile);
    }
  }

  // 壁牌判断：该牌4张全现则100%安全
  if(tile.t==='num'){
    const ownKnown=(GS.players[playerIdx].hand||[]).filter(function(t){return teq(t,tile);}).length;
    if(visibleTileCount(tile)+ownKnown>=4)score+=AI_STRATEGY.safety.wall;
  }
  // 对手副露分析：对手碰了同花色则减分（小心清一色/混一色）
  for(let opp=0;opp<4;opp++){
    if(opp===playerIdx)continue;
    const melds=GS.players[opp].melds||[];
    for(const m of melds){
      if(m.count>=3&&m.tile.t==='num'&&m.tile.s===tile.s)score-=AI_STRATEGY.safety.opponentMeldSuitDanger;
    }
  }
  return score;
}

// 筋牌判断：对手打过 X → Y 的 ryanmen 等待不成立
function isSujiSafe(tile,oppIdx){
  if(tile.t!=='num')return false;
  const discards=GS.playerDiscards[oppIdx]||[];
  const suji={1:[4],2:[5],3:[6],4:[1,7],5:[2,8],6:[3,9],7:[4],8:[5],9:[6]};
  const tgts=suji[tile.v]||[];
  for(const d of discards){
    if(d.t==='num'&&d.s===tile.s&&tgts.includes(d.v))return true;
  }
  return false;
}

// 壁牌检测：同位牌全部已现（4张）-> 该牌的安全性上升
function isBlockedSuji(tile,oppIdx,playerIdx){
  if(tile.t!=='num')return false;
  function vis(key){let c=0;for(let i=0;i<4;i++){for(const d of (GS.playerDiscards[i]||[]))if(d.k===key)c++;for(const m of (GS.players[i].melds||[]))if(m.tile.k===key)c+=m.count;}for(const t of (GS.players[playerIdx].hand||[]))if(t.k===key)c++;return c;}
  const s={1:[4],2:[5],3:[6],4:[1,7],5:[2,8],6:[3,9],7:[4],8:[5],9:[6]};
  const b=s[tile.v]||[];
  for(const bv of b){if(vis(tile.s+bv)>=4)return true;}
  return false;
}

// 评估对手听牌概率（0-10）
function estimateOpponentTenpai(oppIdx){
  let s=0;const melds=GS.players[oppIdx].melds||[];const hl=GS.players[oppIdx].hand.length;
  s+=melds.length*3;
  if(GS.turn>=64)s+=4;else if(GS.turn>=48)s+=3;else if(GS.turn>=32)s+=2;else if(GS.turn>=16)s+=1;
  if(hl<=4)s+=3;else if(hl<=7)s+=1;
  return Math.min(s,10);
}

// 检测手牌中是否有字牌搭子（中+发等白, 东+南+西+北任两种等第三种）
function detectHonorTaatsu(hand){
  const w=new Set(),d=new Set();
  for(const t of hand){
    if(t.t!=='honor')continue;
    if('dongnanxibei'.includes(t.s))w.add(t.s);
    else if('zhongfabai'.includes(t.s))d.add(t.s);
  }
  const r=[];
  if(d.size>=2)r.push('3yuan');
  if(w.size>=2)r.push('4wind');
  return r;
}


// 综合自摸判断：检查所有牌型（面子手、七对子、打烂、半正宗、全正宗）
function canSelfWin(hand,winTile,winType,preMelds){
  const ruleMelds=normalizedRuleMelds(preMelds);
  if(!hand||hand.length+ruleMelds.length*3<14)return false;
  // 面子手 + 七对子（真胡）
  const n=canHuNormal(hand,false,ruleMelds,winTile,winType);
  if(n&&n.win)return true;
  // 打烂/正宗：0 issues = 完成
  if(ruleMelds.length===0){
    try{
      if(calcShantenDalan(hand)===0)return true;
      if(calcShantenBanzhengzong(hand)===0)return true;
      if(calcShantenZhengzong(hand)===0)return true;
    }catch(e){console.warn('[win check] special route shanten failed',e);}
  }
  return false;
}
function canSelfWinForPlayer(playerIdx,winTile,winType){
  return canSelfWin(concealedHand(playerIdx),winTile,winType,ruleMeldsForPlayer(playerIdx));
}

// 听牌形：统计有效进张数
function countWaits(hand,playerIdx){

}

function listWaitsWithMelds(hand,playerIdx,melds,unavailableTileKey){
  const ruleMelds=normalizedRuleMelds(melds);
  const result=[];
  for(const k of ALL_KEYS){
    if(k===unavailableTileKey||aiRemainingCountForWait(k,playerIdx,hand)<=0)continue;
    const testHand=[...hand,kt(k)];
    const winTile=kt(k);
    const win=canHuNormal(testHand,false,ruleMelds,winTile,'自摸');
    if(win&&win.win)result.push(k);
  }
  return result;
}

// Wait enumeration only classifies concrete meld tiles from the live game state.

}

// 搭子质量评估：数牌相邻对越多越高分，两面>嵌张>边张
function handPotential(hand){
  let score=0;
  const groups={wan:{},tong:{},tiao:{}};
  for(const t of hand){
    if(t.t==='num')groups[t.s][t.v]=(groups[t.s][t.v]||0)+1;
  }
  for(const v of Object.values(groups)){
    const keys=Object.keys(v).map(Number).sort((a,b)=>a-b);
    for(let i=0;i<keys.length;i++){
      const cnt=v[keys[i]];
      // Triplet potential includes meld value plus kong upgrade potential.
      if(cnt>=3){score+=9;}
      // Pair potential includes pair value plus pong/kong upgrade potential.
      else if(cnt>=2){score+=3;}
    }
    for(let i=0;i<keys.length-1;i++){
      if(keys[i+1]===keys[i]+1){
        // 两面搭子：45（等36）vs 12（等3）
        if(keys[i]>=2&&keys[i+1]<=8)score+=3;
        else score+=1; // 边张12/89
      }else if(keys[i+1]===keys[i]+2){
        score+=1.5; // 嵌张
      }
    }
  }
  // 字牌基础分：孤张扣分 / 对子+2 / 刻子+3
  // 万年麻将特殊规则：东南西北任意三张可成刻子，中发白任意三张可成刻子
  const hCnts={};
  const windSet=new Set(['dong','nan','xi','bei']);
  const dragonSet=new Set(['zhong','fa','bai']);
  for(const t of hand){
    if(t.t==='honor')hCnts[t.s]=(hCnts[t.s]||0)+1;
  }
  let windKinds=0, dragonKinds=0;
  for(const k of Object.keys(hCnts)){
    if(windSet.has(k))windKinds++;
    if(dragonSet.has(k))dragonKinds++;
  }
  for(const [k,cnt] of Object.entries(hCnts)){
    if(cnt>=3)score+=3;
    else if(cnt>=2)score+=2;
    else score-=1.5;  // 字牌孤张应扣分，优先弃掉
  }
  // 风牌搭子：2种不同风牌可等第3种成刻子（如西+北等东或南）
  if(windKinds>=2)score+=3;  // 抵消两个孤张的-3，相当于搭子价值
  // 三元牌搭子：2种不同三元牌可等第3种成刻子（如中+发等白）
  if(dragonKinds>=2)score+=3;

    return score;
}

function furoTransitionStructureScore(hand,idx,playerIdx){
  if(aiFixedMeldCount(playerIdx)<=0)return 0;
  const tile=hand[idx];
  if(!tile||tile.t!=='num')return 0;
  const sameSuit=hand.filter(function(t){return t.t==='num'&&t.s===tile.s;});
  const countValue=function(v){return sameSuit.filter(function(t){return t.v===v;}).length;};
  const tileCount=countValue(tile.v);
  const hasNeighbor=countValue(tile.v-1)>0||countValue(tile.v+1)>0;
  let score=0;
  if(tileCount===1&&!hasNeighbor)score+=3;
  for(let pairValue=2;pairValue<=8;pairValue++){
    if(countValue(pairValue)>=2&&countValue(pairValue-1)>0&&countValue(pairValue+1)>0){
      if(tile.v===pairValue)score-=5;
      else if(tile.v===pairValue-1||tile.v===pairValue+1)score-=6;
    }
  }
  return score;
}
function furoTransitionCoreReason(hand,discardIdx,playerIdx){
  const hasMeld=aiFixedMeldCount(playerIdx)>0||recommendationMelds().some(function(m){return m.player===playerIdx;});
  if(!hasMeld)return '';
  const discard=hand[discardIdx];
  if(!discard||discard.t!=='num')return '';
  const sameDiscard=hand.filter(function(t){return teq(t,discard);}).length;
  if(sameDiscard!==1)return '';
  if(aiBreaksMeld(hand,discardIdx)||aiBreaksTaatsu(hand,discardIdx)||aiBreaksPair(hand,discardIdx))return '';
  const suitNames={wan:'万',tong:'筒',tiao:'条'};
  for(const suit of suits){
    const nums=hand.filter(function(t){return t.t==='num'&&t.s===suit;}).map(function(t){return t.v;});
    const countValue=function(v){return nums.filter(function(n){return n===v;}).length;};
    for(let pairValue=2;pairValue<=8;pairValue++){
      if(countValue(pairValue)>=2&&countValue(pairValue-1)>0&&countValue(pairValue+1)>0){
        if(discard.s===suit&&(discard.v===pairValue-1||discard.v===pairValue||discard.v===pairValue+1))continue;
        const label=''+(pairValue-1)+pairValue+pairValue+(pairValue+1)+suitNames[suit];
        return '建议打出'+lbl(discard)+'，因为它是当前孤张；'+label+' 是副露后转听核心结构，后续碰牌或转听时需要保留。';
      }
    }
  }
  return '';
}

  if(!lastResult||!Array.isArray(lastResult.scoreDeltas)||lastResult.scoreDeltas.length!==4||!lastResult.scoreDeltas.every(Number.isFinite))return '';

const pathNames={norm:'面子手','7p':'七对子',dalan:'打烂',quanzheng:'全正宗',banzheng:'半正宗'};

function htmlSafe(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});
}

function getAiDecisionLogSource(){
  let gameLog=GS._gameLog||null;
  let decisions=(gameLog&&gameLog.suggestLogs?gameLog.suggestLogs:[]).filter(function(x){return x.isAiDecision;});
  if(decisions.length)return {gameLog:gameLog,decisions:decisions};
  let saved=[];
  try{saved=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){console.warn('[ai log] saved log read failed',e);}
  for(let i=0;i<saved.length;i++){
    const savedDecisions=(saved[i].suggestLogs||[]).filter(function(x){return x.isAiDecision;});
    if(savedDecisions.length)return {gameLog:saved[i],decisions:savedDecisions};
  }
  return {gameLog:gameLog,decisions:[]};
}

// calcShanten 自洽性验证：弃牌后向听数不应突变 >1
function validateShanten(hand,lbl){
  const before=calcShanten(hand);
  for(let i=0;i<hand.length;i++){
    const sub=hand.filter((_,j)=>j!==i);
    const after=calcShanten(sub);
    if(after>before+1){
      console.warn('calcShanten异常('+lbl+'):',hand.map(t=>tkey(t)).join(','),'弃',tkey(hand[i]),before,'→',after);
    }
  }
}
function logSuggestion(hand,playerIdx,bestShanten,bestPath,discardTile,discardSub,decisionLog){
  if(!GS._gameLog)return;
  if(!GS._gameLog.suggestLogs)GS._gameLog.suggestLogs=[];
  // 计算清一色/混一色标注
  const bias=suitBias(hand);
  let displayPath=bestPath;
  if(bestPath==='norm'){
    if(bias.type==='clear')displayPath='clear';
    else if(bias.type==='mixed')displayPath='mixed';

function checkActionOpportunities(playerIdx,GS){
  const results={pong:[],chi:[],kong:[]};
  const hand=GS.players[playerIdx].hand;
  const lastDiscard=GS.lastDiscard;
  const lastDiscardPlayer=GS.lastDiscardPlayer;
  
  if(!lastDiscard)return results;
  
  // 碰：手牌中有 ≥2 张与弃牌相同
  const count=hand.filter(function(t){return t.k===lastDiscard.k;}).length;
  if(count>=2&&lastDiscardPlayer!==playerIdx){
    results.pong.push({tile:lastDiscard.k,count:count});
  }
  
  // 杠：明杠（手中有3张与弃牌相同）或加杠（已碰后又摸到）
  if(count===3&&lastDiscardPlayer!==playerIdx){
    results.kong.push({tile:lastDiscard.k,type:'明杠'});
  }
  const melds=GS.players[playerIdx].melds||[];
  for(let i=0;i<melds.length;i++){
    const m=melds[i];
    if(m.type==='peng'){
      const sameInHand=hand.filter(function(t){return t.k===m.tile.k;}).length;
      if(sameInHand>=1){
        results.kong.push({tile:m.tile.k,type:'加杠'});
      }
    }
  }
  
  return results;
}
