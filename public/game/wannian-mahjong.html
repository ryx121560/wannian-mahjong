function responseFollowUpDiscardAdvice(handAfterCall,playerIdx){
  try{
    if(!Array.isArray(handAfterCall)||handAfterCall.length===0)return null;
    const candidateIndices=handAfterCall.map(function(_,idx){return idx;});
    const evaluated=evaluateDiscardCandidates(handAfterCall,playerIdx,{candidateIndices:candidateIndices});
    const bestIdx=evaluated&&evaluated.bestCands&&evaluated.bestCands.length?evaluated.bestCands[0]:-1;
    if(bestIdx<0||!handAfterCall[bestIdx])return null;
    const tile=handAfterCall[bestIdx];
    const detail=evaluated.candDetails&&evaluated.candDetails.find(function(item){return item.idx===bestIdx;});
    const shanten=detail&&Number.isFinite(detail.s)?detail.s:evaluated.bestShanten;
    const route=detail&&detail.path?detail.path:null;
    const keepsStructure=!(detail&&(detail.breaksMeld||detail.breaksPair||detail.breaksTaatsu||detail.dragonComboBreak));
    const safety=defenseScore(tile,playerIdx);
    let reason='打'+lbl(tile)+'后为'+shanten+'向听';
    if(keepsStructure)reason+='，不明显破坏面子、对子或搭子';
    else reason+='，虽然会动到局部结构，但综合向听和后续进张更合适';
    if(detail&&detail.dragonComboBreak)reason+='，此牌会拆三元组合，只有收益更高时才考虑';
    if(tile.t==='honor')reason+='，字牌单张的后续进张价值较低';
    else if(safety>=2)reason+='，公开信息下安全性相对更好';
    reason+='。';
    return {followUpDiscard:tkey(tile),followUpDiscardLabel:lbl(tile),followUpShanten:shanten,followUpRoute:route,followUpReason:reason};
  }catch(error){
    console.warn('[recommendation] response follow-up discard failed',error);
    return null;
  }
}

    if(GS.canK){const ha=simAfterPongKong(GS.players[0].hand,t,3);const ps=Math.max(0,_bs(ha)-2);humanCandidates.push({tile:tkey(t),tileLabel:'杠 '+lbl(t),totalScore:curS-ps+8,shantenAfter:ps,route:'response',speedScore:curS-ps,kongZhichanScore:1,defenseScore:0,followUpPending:'杠后会先摸一张牌；如果这张牌不能杠开，系统会在下一步出牌建议里重新推荐应打哪张。'});}
    if(GS.canP){const ha=simAfterPongKong(GS.players[0].hand,t,2);const ps=Math.max(0,_bs(ha)-2);const followUp=responseFollowUpDiscardAdvice(ha,0)||{};humanCandidates.push(Object.assign({tile:tkey(t),tileLabel:'碰 '+lbl(t),totalScore:curS-ps+5,shantenAfter:ps,route:'response',speedScore:curS-ps,defenseScore:0},followUp));}

  if(hand.length<1||hand.length>14){el.style.display='none';return;}

  const candIndices=[];

  let bestShanten=evaluated.bestShanten,bestCands=evaluated.bestCands,bestPaths=evaluated.bestPaths,candDetails=evaluated.candDetails;

  let bestIdx=bestCands[0],bestPath=bestPaths[0],candScores={};
  {
    const danger=dangerLevel(0),phase=GS.turn<=24?'early':GS.turn<=48?'mid':'late';
    let safeW=aiDefenseWeight(danger,phase,0,bestShanten);

      else if(p==='banzheng')q=dalanDiscardScore(hand[ci],d.sub)+zhengzongDiscardBonus(hand[ci],d.sub)*0.5;
      else q=handPotential(d.sub);
      const qBase=q;
      let pairAdj=0;
      if(p==='7p'){const oc=hand.filter(function(h){return teq(h,hand[ci]);}).length;if(oc===1)pairAdj+=4;if(hand[ci].t==='honor'&&oc===1)pairAdj+=2;q+=pairAdj;
        // 搭子保护：弃单张数牌若有相邻牌（搭子关系）则扣分，保留面子手灵活性
        if(oc===1&&hand[ci].t==='num'){const t=hand[ci];const hasBuddy=hand.some(function(h,j){return j!==ci&&h.t==='num'&&h.s===t.s&&Math.abs(h.v-t.v)===1;});if(hasBuddy)q-=2;}
      }
      const dragonAdj=aiBreaksDragonCombo(hand,ci)?-8:0;
      const mixedInfo=mixedStrongDiscardInfo(hand,hand[ci]);
      const mixedRouteAdj=mixedInfo.adjustment||0;
      let singleHonorAdj=0;
      const singleHonorDiscard=aiUnprotectedSingleHonor(hand,ci);
      const recommendationDefenseScores=bestCands.map(function(candidateIdx){return defenseScore(hand[candidateIdx],0);});
      const recommendationDefenseDiff=Math.max(...recommendationDefenseScores)-Math.min(...recommendationDefenseScores);
      const isolatedAdj=aiCanUseIsolatedTieBreak(0,danger,phase,bestShanten,recommendationDefenseDiff)?aiIsolatedDiscardPriority(hand,ci)*0.25:0;
      const edgeVisibleAdj=visibleEdgeIsolatedAdj(hand,ci,0);
      const structureAdj=(d.breaksMeld?-10:0)+(d.breaksTaatsu?-4:0)+(d.windComboBreak?-8:0)+(d.breaksPair?-3:0);
      const furoTransitionAdj=furoTransitionStructureScore(hand,ci,0);
      q+=dragonAdj+isolatedAdj+edgeVisibleAdj+structureAdj+furoTransitionAdj+mixedRouteAdj;
      let suitAdj=0;
      if(p==='norm'){
        if(bias.type==='clear'&&hand[ci].t==='num'&&hand[ci].s===bias.suit)suitAdj=-6;
        else if(bias.type==='mixed'&&hand[ci].t==='num'&&hand[ci].s===bias.suit)suitAdj=-4;
        else if(bias.type==='mixed'&&hand[ci].t==='honor')suitAdj=-3;
        else if(bias.type==='semi-clear'&&hand[ci].t==='num'&&hand[ci].s===bias.suit)suitAdj=-3;
        // 补全 mixed-lean 保护（与 aiChooseDiscard 一致），防止三元牌孤张评分偏差
        else if(bias.type==='mixed-lean'&&hand[ci].t==='num'&&hand[ci].s===bias.suit)suitAdj=-3;
        else if(bias.type==='mixed-lean'&&hand[ci].t==='honor'&&!singleHonorDiscard)suitAdj=-2;
        q+=suitAdj;
      }
      if(p==='norm'&&singleHonorDiscard){singleHonorAdj=3;q+=singleHonorAdj;}
      // 对子保留惩罚：防止AI拆对子留孤张（与 aiChooseDiscard 一致）
      let pairPenalty=0;
      if(p==='norm'){
        const origCnt=hand.filter(function(h){return teq(h,hand[ci]);}).length;
        if(origCnt===2){
          const skipBias=(bias.type==='clear'||bias.type==='mixed'||bias.type==='semi-clear')&&hand[ci].t==='num'&&hand[ci].s!==bias.suit;
          if(!skipBias){
            pairPenalty=-3;  // 普通对子，加重惩罚（-2→-3）
            if(bias.type==='mixed')pairPenalty=-5;  // 加重（-3→-5）
            // mixed-lean 染手：对子也需保护（防止误拆）
            if(bias.type==='mixed-lean'&&hand[ci].t==='num'&&hand[ci].s===bias.suit)pairPenalty=-5;
            if(bias.type==='mixed-lean'&&hand[ci].t==='honor')pairPenalty=-4;
          }
        }
        q+=pairPenalty;
      }
      let phaseAdj=0;
      if(phase==='early'){phaseAdj=0.3;q+=phaseAdj;}
      const defRaw=defenseScore(hand[ci],0);
      var _pc=hand.filter(function(h){return teq(h,hand[ci]);}).length;const sc=q+safeW*defRaw+(_pc>=2&&_pc<=3?-2.5:0);
      candScores[ci]={qBase:qBase,pairAdj:pairAdj,suitAdj:suitAdj,phaseAdj:phaseAdj,dragonAdj:dragonAdj,isolatedAdj:isolatedAdj,edgeVisibleAdj:edgeVisibleAdj,structureAdj:structureAdj,furoTransitionAdj:furoTransitionAdj,mixedRouteAdj:mixedRouteAdj,mixedRouteType:mixedInfo.type,mixedRouteReason:mixedInfo.reason,singleHonorAdj:singleHonorAdj,defRaw:defRaw,safeW:safeW,sc:sc};
      if(bestCandSet.has(ci)&&bestCands.length>1&&sc>bestScore){bestScore=sc;bestIdx=ci;bestPath=p;}
    });
  }

  logSuggestion(hand,0,bestShanten,bestPath,hand[bestIdx],hand.filter(function(_,j){return j!==bestIdx;}));

  const rT=candDetails.find(function(c){return c.idx===bestIdx;});
  const bias=suitBias(hand);
  const suitCN={wan:'万',tong:'筒',tiao:'条'};
  const reasons=[];
  // 确定显示路线名称
  let displayPath=bestPath;
  if(bestPath==='norm'){
    if(bias.type==='clear')displayPath='clear';
    else if(bias.type==='mixed')displayPath='mixed';
  }
  const displayNames={norm:'面子手','7p':'七对子',dalan:'打烂',quanzheng:'全正宗',banzheng:'半正宗',clear:'清一色',mixed:'混一色'};
  reasons.push('当前走 <b>'+displayNames[displayPath]+'</b> 路线最优');
  if(bestPath==='dalan'){
    if(calcShantenDalan(rT.sub)===0)reasons.push('<b>打烂已成！</b>');
    else{
      const dup=hand.length-new Set(hand.map(function(t){return t.k;})).size;
      const hc=new Set(hand.filter(function(t){return t.t==='honor';}).map(function(t){return t.k;})).size;
      if(dup>0)reasons.push('还有 '+dup+' 张重复牌待处理');
      if(hc<5)reasons.push('字牌 '+hc+'/5，仍需 '+(5-hc)+' 张');
    }
  }else if(bestPath==='quanzheng'){
    reasons.push('全正宗路线：数牌限定同组147/258/369');
    const validNums=new Set([1,4,7,2,5,8,3,6,9]);
    const invalidCnt=hand.filter(function(t){return t.t==='num'&&!validNums.has(t.v);}).length;
    if(invalidCnt>0)reasons.push('还有 '+invalidCnt+' 张非正宗数牌待处理');
  }else if(bestPath==='banzheng'){
    reasons.push('半正宗路线：数牌在147/258/369组内（可跨组）');
    const validNums=new Set([1,4,7,2,5,8,3,6,9]);
    const invalidCnt=hand.filter(function(t){return t.t==='num'&&!validNums.has(t.v);}).length;
    if(invalidCnt>0)reasons.push('还有 '+invalidCnt+' 张非正宗数牌待处理');
  }else if(bestPath==='7p'){
    const freq={};
    hand.forEach(function(t){freq[t.k]=(freq[t.k]||0)+1;});
    const pCnt=Object.values(freq).filter(function(v){return v>=2;}).length;
    reasons.push('<b>已有 '+pCnt+' 对，还差 '+(6-pCnt)+' 对听牌</b>');
  }else{
    reasons.push('弃 '+lbl(hand[bestIdx])+' 后向听数 '+bestShanten);
    const dng=dangerLevel(0),phase=GS.turn<=24?'early':GS.turn<=48?'mid':'late';
    const dsc=defenseScore(hand[bestIdx],0);
    const dngLabel=dng>=4?'极高危':dng>=3?'高危':dng>=2?'中危':dng>=1?'低危':'安全';
    const modeLabel=dng>=2&&bestShanten>=3?'全力防守':dng>=2?'攻守兼顾':phase==='late'?'末盘谨慎':'正常进攻';
    reasons.push('\u26a0 危险度：'+dngLabel+'（'+dng+'） | 阶段：'+{'early':'序盘','mid':'中盘','late':'末盘'}[phase]+' | 策略：'+modeLabel);
    if(dsc>=8)reasons.push('\u2705 '+lbl(hand[bestIdx])+' 安全分 '+dsc+'：自己打过，绝对安全');
    else if(dsc>=5)reasons.push('\u2705 '+lbl(hand[bestIdx])+' 安全分 '+dsc+'：对手已弃，现物安全');
    else if(dsc>=2)reasons.push('\u26a0 '+lbl(hand[bestIdx])+' 安全分 '+dsc+'：筋牌理论安全');
    else if(dng>=2)reasons.push('\u2757 '+lbl(hand[bestIdx])+' 安全分 '+dsc+'：有一定放铳风险');
    if(bias.type==='clear')reasons.push('清一色倾向：'+suitCN[bias.suit]+' '+bias.count+'张');
    else if(bias.type==='mixed')reasons.push('混一色倾向：'+suitCN[bias.suit]+'+字牌 '+bias.count+'张');
    else if(bias.type==='semi-clear')reasons.push('偏向 '+suitCN[bias.suit]+' 染手');
  }

  // 听牌分析（bestShanten===0）：列出等牌及剩余枚数
  if(bestShanten===0&&(bestPath==='norm'||bestPath==='7p')){
    const subHand=hand.filter(function(_,j){return j!==bestIdx;});
    const waits=listWaits(subHand,0);
    const waitDetails=waits.map(function(k){return {k:k,remain:aiRemainingCountForWait(k,0,subHand,hand[bestIdx])};}).filter(function(w){return w.remain>0;}).sort(function(a,b){return b.remain-a.remain;});
    if(waitDetails.length>0){
      const totalRemain=waitDetails.reduce(function(s,w){return s+w.remain;},0);
      const waitStr=waitDetails.map(function(w){return lbl(kt(w.k))+'×'+w.remain;}).join(' ');
      reasons.push('<b>听牌（'+waitDetails.length+'种'+totalRemain+'枚）：'+waitStr+'</b>');
    }else reasons.push('<b>不听牌</b>');
  }

  // 一向听待牌分析（bestShanten===1）：列出进张后能听哪些牌
  if(bestShanten===1&&(bestPath==='norm'||bestPath==='7p')){
    const subHand=hand.filter(function(_,j){return j!==bestIdx;});
    const waits=listWaits(subHand,0);
    const waitDetails=waits.map(function(k){return {k:k,remain:aiRemainingCountForWait(k,0,subHand,hand[bestIdx])};}).filter(function(w){return w.remain>0;});
    if(waitDetails.length>0){
      const totalWaits=waitDetails.reduce(function(sum,w){return sum+w.remain;},0);
      const waitStr=waitDetails.map(function(w){return lbl(kt(w.k));}).join(' ');
      reasons.push('<b>待牌（'+waitDetails.length+'种'+totalWaits+'张）：'+waitStr+'</b>');
    }else reasons.push('<b>无进张</b>');
  }

  const actions=checkActionOpportunities(0,GS);
  let actionHtml='';
  if(actions.pong.length>0){
    actionHtml+='<div class="suggest-action suggest-pong"><span class="action-label">碰</span> '+actions.pong.map(function(a){return a.tile+'（手中有'+a.count+'张）';}).join('、')+'</div>';
  }
  if(actions.kong.length>0){
    actionHtml+='<div class="suggest-action suggest-kong"><span class="action-label">杠</span> '+actions.kong.map(function(a){return a.tile+'（'+a.type+'）';}).join('、')+'</div>';
  }
  const selectedTile=getSelectedTile();
  const candidateViews=candDetails.map(function(detail){return candidateViewFromDetail(detail,hand,candScores,0);});
  let finalIdx=bestIdx;
  let finalKey=tkey(hand[finalIdx]);
  let mctsSummary=null;
  try{
    const ruleCandidateView=candidateViews.find(function(item){return item.tile===finalKey;})||candidateViews[0]||null;
    const strongAction=ruleCandidateView?'打'+ruleCandidateView.tileLabel:null;
    const mctsCandidates=candDetails.map(function(detail){return mctsCandidateFromDiscardDetail(detail,hand,0,strongAction,candScores);});
    if(mctsCandidates.length){
      mctsSummary=MCTS_ENHANCEMENT.decideWithMcts(mctsDecisionContext(0,'recommendation',mctsCandidates,strongAction,hand.map(tkey)));
      const mctsFinal=mctsSummaryFinalCandidate(mctsSummary,mctsCandidates);
      if(mctsFinal){
        const parts=String(mctsFinal.id||'').split(':');
        const parsedIdx=Number(parts[1]);
        if(Number.isFinite(parsedIdx)&&hand[parsedIdx]){
          finalIdx=parsedIdx;
          finalKey=tkey(hand[finalIdx]);
        }
      }
    }
  }catch(error){console.warn('[mcts-enhancement] discard recommendation fallback',error);}
  const sortedCandidateViews=candidateViews.slice().sort(function(a,b){
    if(a.tile===finalKey&&b.tile!==finalKey)return -1;
    if(b.tile===finalKey&&a.tile!==finalKey)return 1;
    const scoreGap=(b.totalScore||0)-(a.totalScore||0);
    if(Math.abs(scoreGap)>0.001)return scoreGap;
    return candidateNumber(a.shantenAfter,99)-candidateNumber(b.shantenAfter,99);
  });
  const systemRecommendation=sortedCandidateViews.find(function(item){return item.tile===finalKey;})||sortedCandidateViews[0]||null;
  const furoTransitionReason=furoTransitionCoreReason(hand,finalIdx,0);
  const unifiedDecision=createUnifiedDecisionResult(hand,0,{finalIdx:finalIdx,source:'recommendation',reason:'真人推荐入口采用阶段七统一复核后的最终候选',extra:{mctsSummary:mctsSummary},record:false});
  if(GS._recommendation){
    GS._recommendation.selectedTileKey=selectedTile?tkey(selectedTile):null;
    GS._recommendation.unifiedDecision=unifiedDecision;
  }
  const context=recommendationBaseContext({
    handKeys:hand.map(tkey),
    concealedHandKeys:hand.map(tkey),
    meldContext:recommendationMelds(),
    selectedTile:selectedTile?tkey(selectedTile):null,
    candidates:sortedCandidateViews,
    systemRecommendation:systemRecommendation,
    furoTransitionReason:furoTransitionReason,
    mctsSummary:mctsSummary
  });
  renderRecommendationPanel(context);
}

function toggleSelfPlay(){
  clearSelectedTile();
  if(_selfPlay.running){
    _selfPlay.running=false;
  _selfPlay.buffer=[];  // 保持空，下局重新收集
    configureAiLearning(false);

    document.getElementById('bt-selfplay').textContent='自弈';
    setSelfPlayUiState();
    
    GS._noRender=false;GS._selfPlay=false;
    // 清除所有待处理的AI定时器，防止残留回调污染人类玩家状态
    clearTimeout(GS._aiActionTimer);GS._aiActionTimer=null;
    clearTimeout(GS._aiAnimTimer);GS._aiAnimTimer=null;
    clearTimeout(GS._aiNextTurnTimer);GS._aiNextTurnTimer=null;
    clearTimeout(GS._respTimer);GS._respTimer=null;
    GS._aiDiscardAnim=null;
    // 恢复玩家0为人类，并重置摸牌状态防止僵尸引用泄漏
    if(GS.players[0])GS.players[0].human=true;
    GS.newDrawnTile=null;GS.newDrawnIdx=-1;
    // Ask the player to resolve abnormal overflow instead of discarding automatically.
    if(GS.players[0]&&GS.players[0].hand&&GS.players[0].hand.length>14){
      console.warn('[toggleSelfPlay] 手牌异常，转入玩家弃牌选择：'+GS.players[0].hand.length);
      GS.cur=0;GS.phase='discarding';GS.canP=GS.canK=GS.canW=false;GS.canWS=canSelfWinForPlayer(0,GS.newDrawnTile,'自摸');
      setMsg('手牌数量异常，请先选择一张牌打出');
    }
    fitCanvas();render();saveGameSnapshot('self-play-disabled');
    return;
  }
  _selfPlay.running=true;
  _selfPlay.audit={invalidWins:0,suspiciousWins:0,failures:[]};
  configureAiLearning(true);
  _selfPlay.trainer=null;  _selfPlay.buffer=[];  _selfPlay.useGPU=true;

  try{var _mlp=null;try{var _d=localStorage.getItem("rl_model");if(_d){_mlp=GPUMlp.deserialize(_d);}}catch(e){console.warn('[SP] model load failed',e);}if(!_mlp)_mlp=new GPUMlp();_selfPlay.trainer=new RLTrainer(_mlp);_selfPlay.trainer.lr=0.001;console.log('[SP] trainer OK');}catch(e){console.warn('[SP] trainer init:',e.message);}
  document.getElementById('bt-selfplay').textContent='停止';
  setSelfPlayUiState();
  _selfPlay.count=totalGamesPlayed;
  document.getElementById('sp-count').textContent=_selfPlay.count;setSelfPlayUiState();
  startSelfPlayGame();
}
function startSelfPlayGame(){
  if(!_selfPlay.running)return;
  _selfPlay.count++;
  document.getElementById('sp-count').textContent=_selfPlay.count;setSelfPlayUiState();
  setMsg('自弈进行中，第'+_selfPlay.count+'局');
  GS._selfPlay=true;
  // 如果当前没有游戏在进行，则开新局；否则继续当前局，但所有玩家转为AI
  if(!GS.players||GS.players.length===0||GS.phase==='idle'||GS.phase==='ended'){
    newGame();
  }
  // 将所有人类玩家转为AI
  for(let i=0;i<4;i++){
    if(GS.players[i])GS.players[i].human=false;
  }
  // 清除所有待处理的AI定时器，防止自弈启动时与旧定时器竞态
  clearTimeout(GS._aiActionTimer);GS._aiActionTimer=null;
  clearTimeout(GS._aiAnimTimer);GS._aiAnimTimer=null;
  clearTimeout(GS._aiNextTurnTimer);GS._aiNextTurnTimer=null;
  GS._aiDiscardAnim=null;
  // 直接调用当前玩家的AI行动
  if(GS.cur>=0&&GS.cur<4){
    // 新范式下摸牌已推入手牌，newDrawnTile 在手牌中引用
    // 若 newDrawnTile 为僵尸引用（不在手牌中），直接丢弃，拒绝 push
    // 手牌状态由 toggleSelfPlay 停止时的归一化保证
    GS.newDrawnTile=null;GS.newDrawnIdx=-1;
    saveGameSnapshot('self-play-enabled');
    if(GS.phase==='discarding')aiDiscard(GS.cur);
    else if(GS.phase==='drawing')aiTurn(GS.cur);
  }
}

// ShantenLUT 生成器
function generateShantenLUT(count){
  count=count||3000;
  var lut={},keys=[];
  for(var i=0;i<count;i++){
    var hand=[];
    for(var j=0;j<13;j++)hand.push(TILES[Math.floor(Math.random()*TILES.length)]);
    var s=bestShanten(hand);
    var k=hand.map(t=>t.k).sort().join(",");
    if(lut[k]===undefined){lut[k]=s;keys.push({h:k,s:s});}
  }
  var blob=new Blob([JSON.stringify(keys)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="shanten_lut.json";a.click();
  console.log("[LUT] 生成 "+keys.length+" 条，下载中...");
}window.RL&&RL.init();

function _drawLossChart(){
  var h=_selfPlay.lossHistory||[];console.log("[Chart] h.len="+h.length+" vals="+(h.length?h.map(function(v){return v.toFixed(2);}).join(","):"none"));
  console.log('[Chart] h.length='+h.length);
  if(h.length<2){console.log('[Chart] wait data...');return;}
  console.log('[Chart] drawing line...');
  var c=document.getElementById("sp-chart");
  if(!c)return;
  var ctx=c.getContext("2d");
  var w=c.width,ht=c.height,pad=3;
  ctx.clearRect(0,0,w,ht);
  ctx.fillStyle='#000';ctx.fillRect(0,0,w,ht);
  var mn=Math.min.apply(null,h),mx=Math.max.apply(null,h);
  var rg=mx-mn||1;
  ctx.strokeStyle="#0f0";ctx.lineWidth=3;
  ctx.beginPath();
  for(var i=0;i<h.length;i++){
    var x=pad+(w-2*pad)*i/(h.length-1);
    var y=pad+(ht-2*pad)*(1-(h[i]-mn)/rg);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.fillStyle="#0f0";ctx.font="bold 10px monospace";
  ctx.fillText(mx.toFixed(2),160,12);
  ctx.fillText(mn.toFixed(2),160,ht-4);
}
// === RL Self-Play training ===
function _spEncodeState(p){
  var st=new Float32Array(74);
  for(var i=0;i<ALL_KEYS.length;i++)st[i]=0;
  for(var t=0;t<GS.players[p].hand.length;t++){
    var idx=ALL_KEYS.indexOf(GS.players[p].hand[t].k);
    if(idx>=0)st[idx]=Math.min(st[idx]+1,4);
  }
  var ml=GS.players[p].melds||[];
  for(var m=0;m<ml.length;m++){
    var ki=ALL_KEYS.indexOf(ml[m].tile.k);
    if(ki>=0)st[34+Math.floor(ki/7)]+=ml[m].count;
  }
  var pd=GS.playerDiscards[p]||[];
  for(var d=0;d<pd.length;d++){
    var kd=ALL_KEYS.indexOf(pd[d].k);
    if(kd>=0)st[50+Math.floor(kd/6)]++;
  }
  st[60]=GS.wall.length;st[61]=GS.turn;
  st[62]=GS.players[p].score/200;
  for(var o=0;o<4;o++){if(o!==p)st[70+o]=(GS.players[o].melds||[]).length;}
  return st;
}

function _spOnDiscard(p,tile){
  if(!_selfPlay.running||!_selfPlay.trainer)return;
  var st=_spEncodeState(p);
  var act=ALL_KEYS.indexOf(tile.k);
  if(act<0)return;
  var tp=new Float32Array(34);
  tp[act]=1;
  _selfPlay.trainer.addExperience(st,tp,0);
  _selfPlay.buffer.push({player:p,idx:_selfPlay.trainer.experience.length-1});
}

async function _spOnGameEnd(winner){console.log("[SP] _spOnGameEnd winner="+winner+" buffer="+(_selfPlay.buffer||[]).length);
  if(!_selfPlay.running||!_selfPlay.trainer||_selfPlay.buffer.length<10)return;
  for(var i=0;i<_selfPlay.buffer.length;i++){
    var e=_selfPlay.buffer[i];
    var ex=_selfPlay.trainer.experience[e.idx];if(ex)ex.targetValue=e.player===winner?1:-1;
  }
  try{var r=_selfPlay.useGPU&&_selfPlay.trainer.mlp&&_selfPlay.trainer.mlp.device?await _selfPlay.trainer.trainMiniBatchGPU():_selfPlay.trainer.trainMiniBatch();}catch(e){console.warn('[SP] GPU err:',e.message);try{r=_selfPlay.trainer.trainMiniBatch();}catch(e2){r=null;}}
  if(r&&r.loss<10){
    _selfPlay.lastLoss=r.loss;
    document.getElementById("sp-info").textContent="训练损失: "+r.loss.toFixed(4);
    _selfPlay.lossHistory=_selfPlay.lossHistory||[];_selfPlay.lossHistory.push(r.loss);

    // 多步训练：当前局数据训练 3 次，加快收敛
    for(var _ti=0;_ti<5;_ti++){var _r2=_selfPlay.trainer.trainMiniBatch();}
  }
  _selfPlay.buffer=[];
  console.log('[SP] chart start');
  try{_drawLossChart();}catch(e){console.error('[SP] chart err:',e.message);}
  window.RL=window.RL||{};
  if(_selfPlay.count%10===0&&_selfPlay.trainer.mlp)_selfPlay.trainer.save();
}
